<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification System</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-accent': '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, #16a34a, #15803d, #166534);
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 15% 20%, rgba(34, 197, 94, 0.15) 0%, rgba(16, 185, 129, 0.08) 40%, transparent 70%),
                radial-gradient(ellipse at 85% 80%, rgba(16, 185, 129, 0.12) 0%, rgba(13, 148, 136, 0.06) 40%, transparent 70%),
                radial-gradient(ellipse at 50% 50%, rgba(13, 148, 136, 0.08) 0%, rgba(21, 128, 61, 0.04) 40%, transparent 70%);
            filter: blur(80px);
            animation: float 30s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            33% { transform: translateY(-30px) scale(1.05); }
            66% { transform: translateY(20px) scale(0.95); }
        }
        .liquid-panel {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.12), rgba(22, 163, 74, 0.08));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }
        .btn-3d {
            background: linear-gradient(145deg, #34d399, #22c55e, #16a34a);
            border: none;
            border-radius: 0.75rem;
            color: white;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #16a34a, 0 8px 15px rgba(34, 197, 94, 0.3);
        }
        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #16a34a, 0 12px 20px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6">
    <div class="flex-grow flex items-center justify-center">
    <div class="liquid-panel p-8 text-center max-w-md">
        <h1 class="text-3xl font-bold text-green-100 mb-4">Certificate Verification System</h1>
        <p class="text-green-200/70 mb-6">Welcome to the NVSU Certificate Verification Portal</p>
        <div class="space-y-3">
            <a href="logIn/LogInAdmin.html" class="w-full block btn-3d py-3 rounded-xl">Admin Login</a>
            <a href="CertificateVerification/CertificateVerification.html" class="w-full block btn-3d py-3 rounded-xl">Verify Certificate</a>
        </div>
        <p class="text-green-200/50 text-xs mt-6">
            Admins: Create and manage events<br>
            Users: Verify your attendance certificate
        </p>
        <p class="text-center text-green-200/50 text-sm pt-4">Information Unit @ 2025</p>
    </div>
    </div>
</body>
</html>
