<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-light': '#86efac'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <h2 class="text-3xl font-bold text-center bg-gradient-to-r from-green-600 to-green-500 bg-clip-text text-transparent mb-2">Create Admin Account</h2>
        <p class="text-center text-gray-500 mb-8">
            Have an account? 
            <a href="../logIn/LogInAdmin.html" class="text-green-600 hover:text-green-700 font-medium">Login here</a>
        </p>
        <form class="space-y-6">
            <div class="space-y-2">
                <label for="adminName" class="block text-sm font-semibold text-gray-700">Admin Name</label>
                <input type="text" id="adminName" name="adminName" required 
                    class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none">
            </div>
            <div class="space-y-2">
                <label for="email" class="block text-sm font-semibold text-gray-700">Email</label>
                <input type="email" id="email" name="email" required 
                    class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none">
            </div>
            <div class="space-y-2">
                <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none">
            </div>
            <div class="space-y-2">
                <label for="confirmPassword" class="block text-sm font-semibold text-gray-700">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required 
                    class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none">
            </div>
            <button type="submit" 
                class="w-full bg-gradient-to-r from-green-600 to-green-500 hover:from-green-700 hover:to-green-600 text-white font-semibold py-3 rounded-lg transition-all transform hover:scale-[1.02] shadow-lg hover:shadow-green-200">
                Sign Up
            </button>
        </form>
    </div>
    <script type="module">
        import '../PopupSystem.js';
        import './SignUpAdmin.js';
    </script>
</body>
</html>
