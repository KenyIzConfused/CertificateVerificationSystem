<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-accent': '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        /* Liquid Glass Effect - Dark Green Theme */
        .glass {
            background: rgba(22, 163, 74, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(22, 163, 74, 0.15);
        }
        .glass-card {
            background: rgba(22, 163, 74, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1.25rem;
            box-shadow: 0 4px 16px rgba(22, 163, 74, 0.12);
        }
        .glass-input {
            background: rgba(22, 163, 74, 0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.35);
            border-radius: 0.75rem;
            color: #f0fdf4;
            transition: all 0.3s ease;
        }
        .glass-input::placeholder {
            color: #bbf7d0;
        }
        .glass-input:focus {
            background: rgba(22, 163, 74, 0.32);
            border-color: rgba(34, 197, 94, 0.6);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
            color: #ffffff;
        }
        .glass-button {
            background: rgba(22, 163, 74, 0.28);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            color: #f0fdf4;
        }
        .glass-button:hover {
            background: rgba(22, 163, 74, 0.4);
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
            color: #ffffff;
        }
        .glass-button:active {
            transform: translateY(0);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.25);
        }
        .primary-button {
            background: rgba(34, 197, 94, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.6);
            transition: all 0.3s ease;
        }
        .primary-button:hover {
            background: rgba(34, 197, 94, 1);
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.25);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-900/90 via-green-800/85 to-green-900/95 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="glass-card p-10 glow-effect">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-green-200 mb-2">Create Admin Account</h2>
                <p class="text-green-300/70">
                    Have an account? 
                    <a href="../logIn/LogInAdmin.html" class="text-green-400 hover:text-green-300 font-medium">Login here</a>
                </p>
            </div>
            <form id="signUpForm" class="space-y-5">
                <div class="space-y-2">
                    <label for="adminName" class="block text-sm font-semibold text-green-300">Admin Name</label>
                    <input type="text" id="adminName" name="adminName" required 
                        class="w-full px-4 py-3 glass-input outline-none transition-all"
                        placeholder="Full name">
                </div>
                <div class="space-y-2">
                    <label for="email" class="block text-sm font-semibold text-green-300">Email</label>
                    <input type="email" id="email" name="email" required 
                        class="w-full px-4 py-3 glass-input outline-none transition-all"
                        placeholder="admin@example.com">
                </div>
                <div class="space-y-2">
                    <label for="password" class="block text-sm font-semibold text-green-300">Password</label>
                    <input type="password" id="password" name="password" required 
                        class="w-full px-4 py-3 glass-input outline-none transition-all"
                        placeholder="Enter password">
                </div>
                <div class="space-y-2">
                    <label for="confirmPassword" class="block text-sm font-semibold text-green-300">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required 
                        class="w-full px-4 py-3 glass-input outline-none transition-all"
                        placeholder="Confirm password">
                </div>
                <button type="submit" 
                    class="w-full primary-button text-white font-semibold py-3">
                    Sign Up
                </button>
            </form>
        </div>
    </div>
    <script type="module">
        import '../PopupSystem.js';
        import './SignUpAdmin.js';
    </script>
</body>
</html>
