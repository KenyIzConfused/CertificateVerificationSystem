<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f6f8fb',
                            100: '#eef2f7',
                            200: '#dde5ef',
                            300: '#c5d3e4',
                            400: '#9bb0ce',
                            500: '#748eb8',
                            600: '#596f9a',
                            700: '#4a5a7d',
                            800: '#3e4a67',
                            900: '#353f53',
                            950: '#1a1f2b'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', 'Arial', 'sans-serif']
                    },
                    backdropBlur: {
                        xs: '2px'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background:
                radial-gradient(at 0% 100%, rgba(120, 142, 184, 0.22), transparent 55%),
                radial-gradient(at 100% 0%, rgba(108, 128, 172, 0.18), transparent 55%),
                linear-gradient(135deg, #f6f8fb 0%, #eef2f7 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 18px 45px -12px rgba(30, 37, 60, 0.18), inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .glass-strong {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 22px 55px -14px rgba(30, 37, 60, 0.22), inset 0 1px 0 rgba(255,255,255,0.95);
        }
        .input-glass {
            background: rgba(255,255,255,0.55);
            border: 1px solid rgba(120,142,184,0.25);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
            transition: all .2s ease;
        }
        .input-glass:focus {
            outline: none;
            border-color: rgba(108,128,172,0.6);
            box-shadow: 0 0 0 4px rgba(108,128,172,0.15), inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .btn-primary {
            background: linear-gradient(180deg, #3a4560 0%, #2b3348 100%);
            color: white;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .btn-secondary {
            background: rgba(255,255,255,0.55);
            border: 1px solid rgba(120,142,184,0.25);
            color: #3a4560;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.75); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-brand-900 antialiased">
    <div class="glass w-full max-w-md rounded-3xl p-8">
        <div class="mb-2 text-center">
            <div class="mx-auto h-12 w-12 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-bold text-xl shadow-lg mb-4">CV</div>
            <h2 class="text-3xl font-bold tracking-tight text-brand-950">Create Admin Account</h2>
            <p class="mt-2 text-sm text-brand-500">Have an account? <a href="../logIn/LogInAdmin.html" class="text-brand-600 hover:text-brand-700 font-medium">Login here</a></p>
        </div>
        <form id="signupForm" class="mt-8 space-y-5">
            <div class="space-y-2">
                <label for="adminName" class="block text-sm font-semibold text-brand-700">Admin Name</label>
                <input type="text" id="adminName" name="adminName" required
                    class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400">
            </div>
            <div class="space-y-2">
                <label for="email" class="block text-sm font-semibold text-brand-700">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400">
            </div>
            <div class="space-y-2">
                <label for="password" class="block text-sm font-semibold text-brand-700">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400">
            </div>
            <div class="space-y-2">
                <label for="confirmPassword" class="block text-sm font-semibold text-brand-700">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                    class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400">
            </div>
            <button type="submit"
                class="w-full btn-primary font-semibold py-3 rounded-xl transition-all shadow-lg">
                Sign Up
            </button>
        </form>
    </div>
    <script type="module">
        import '../PopupSystem.js';
        import './SignUpAdmin.js';
    </script>
</body>
</html>
