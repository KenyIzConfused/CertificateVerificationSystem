<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Unit: Manage Attendees</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-light': '#86efac'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold bg-gradient-to-r from-green-600 to-green-500 bg-clip-text text-transparent">Manage Attendees</h1>
                <p id="eventInfo" class="text-gray-600 mt-1"></p>
            </div>
            <div>
                <button id="exportAttendeesBtn" class="text-green-600 hover:text-green-700 font-medium mr-4">Export to Excel</button>
                <a href="../EventCRUD/EventCRUD.html" class="text-green-600 hover:text-green-700 font-medium">Back to Events</a>
            </div>
        </header>

        <!-- Add Attendee Form -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Add Attendee</h2>
            <form id="addAttendeeForm" class="space-y-6">
                <div class="space-y-2">
                    <label for="attendeeName" class="block text-sm font-semibold text-gray-700">Full Name</label>
                    <input type="text" id="attendeeName" name="attendeeName" required 
                        class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none"
                        placeholder="e.g., Juan Dela Cruz">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="course" class="block text-sm font-semibold text-gray-700">Course</label>
                        <input type="text" id="course" name="course" required 
                            class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none"
                            placeholder="e.g., BSIT">
                    </div>
                    <div class="space-y-2">
                        <label for="role" class="block text-sm font-semibold text-gray-700">Role</label>
                        <input type="text" id="role" name="role" required 
                            class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none"
                            placeholder="e.g., Student, Speaker, Organizer">
                    </div>
                </div>
                <div class="space-y-2">
                    <label for="dateAttended" class="block text-sm font-semibold text-gray-700">Date Attended</label>
                    <input type="date" id="dateAttended" name="dateAttended" required 
                        class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none">
                </div>
                <button type="submit" 
                    class="w-full bg-gradient-to-r from-green-600 to-green-500 hover:from-green-700 hover:to-green-600 text-white font-semibold py-3 rounded-lg transition-all transform hover:scale-[1.02] shadow-lg hover:shadow-green-200">
                    Add Attendee
                </button>
            </form>
        </div>

        <!-- Attendees Counter Panel -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8">
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-bold text-gray-800">Attendees:</h2>
                <span id="attendeeCount" class="text-4xl font-bold text-green-600">0</span>
            </div>
        </div>

        <!-- Attendees Table -->
        <div class="bg-white rounded-2xl shadow-xl p-6 overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="border-b-2 border-green-200">
                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Full Name</th>
                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Course</th>
                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Role</th>
                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Date Attended</th>
                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Status</th>
                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Actions</th>
                    </tr>
                </thead>
                <tbody id="attendeesTableBody">
                </tbody>
            </table>
            <p id="noAttendees" class="text-gray-500 text-center py-8">No attendees added yet.</p>
        </div>
    </div>
    <script type="module" src="AttendeeManagement.js"></script>
</body>
</html>
