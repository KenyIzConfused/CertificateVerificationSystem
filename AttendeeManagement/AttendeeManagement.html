<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Unit: Manage Attendees</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-accent': '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        /* Liquid Glass Effect - Dark Green Theme */
        .glass {
            background: rgba(22, 163, 74, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(22, 163, 74, 0.15);
        }
        .glass-card {
            background: rgba(22, 163, 74, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1.25rem;
            box-shadow: 0 4px 16px rgba(22, 163, 74, 0.12);
        }
        .glass-input {
            background: rgba(22, 163, 74, 0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.35);
            border-radius: 0.75rem;
            color: #f0fdf4;
            transition: all 0.3s ease;
        }
        .glass-input::placeholder {
            color: #bbf7d0;
        }
        .glass-input:focus {
            background: rgba(22, 163, 74, 0.32);
            border-color: rgba(34, 197, 94, 0.6);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
            color: #ffffff;
        }
        .glass-button {
            background: rgba(22, 163, 74, 0.28);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            color: #f0fdf4;
        }
        .glass-button:hover {
            background: rgba(22, 163, 74, 0.4);
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
            color: #ffffff;
        }
        .glass-button:active {
            transform: translateY(0);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.25);
        }
        .primary-button {
            background: rgba(34, 197, 94, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.6);
            transition: all 0.3s ease;
        }
        .primary-button:hover {
            background: rgba(34, 197, 94, 1);
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.25);
        }
        .glass-file {
            background: rgba(22, 163, 74, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 0.75rem;
            color: #f0fdf4;
        }
        .glass-file::file-selector-button {
            background: rgba(34, 197, 94, 0.8);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: 500;
            padding: 0.5rem 1rem;
            margin-right: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .glass-file::file-selector-button:hover {
            background: rgba(34, 197, 94, 1);
            transform: scale(1.05);
        }
        .glass-table {
            background: rgba(22, 163, 74, 0.12);
        }
        .glass-table th {
            background: rgba(22, 163, 74, 0.25);
            color: #e0f2fe;
            font-weight: 600;
        }
        .glass-table td {
            color: #e0f2fe;
        }
        .glass-table tr:hover {
            background: rgba(34, 197, 94, 0.15);
        }
        .action-btn {
            background: rgba(22, 163, 74, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            color: #e0f2fe;
        }
        .action-btn:hover {
            background: rgba(22, 163, 74, 0.35);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-900/90 via-green-800/85 to-green-900/95 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <header class="glass mb-8 p-6 flex flex-col lg:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold text-green-200">Manage Attendees</h1>
                <p id="eventInfo" class="text-green-300/70 mt-1"></p>
            </div>
            <div class="flex flex-wrap gap-3">
                <button id="exportAttendeesBtn" class="glass-button px-5 py-2.5 font-medium flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Export to Excel
                </button>
                <button id="uploadAttendanceBtn" class="primary-button text-white px-5 py-2.5 font-medium flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88 7.237A4.972 4.972 0 017 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                    Upload Attendance
                </button>
                <a href="../EventCRUD/EventCRUD.html" class="glass-button px-5 py-2.5 font-medium flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Back to Events
                </a>
            </div>
        </header>

        <!-- OCR Upload Section -->
        <div id="ocrSection" class="hidden glass-card p-6 mb-8 glow-effect">
            <h2 class="text-2xl font-bold text-green-200 mb-4 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88 7.237A4.972 4.972 0 017 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
                Upload Attendance Document
            </h2>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-green-300 mb-2">Select an image file (JPG, PNG)</label>
                    <input type="file" id="ocrFileInput" accept="image/*" class="block w-full glass-file py-2 px-3 cursor-pointer">
                </div>
                <div id="ocrPreview" class="hidden">
                    <img id="ocrImage" class="max-w-full max-h-64 rounded-lg border border-green-200/30 mb-4" alt="Uploaded preview">
                    <button id="runOcrBtn" class="primary-button text-white px-6 py-2.5 font-medium flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 0l3-3m-3 0l3 3m-6 0v6m0-6V9"></path>
                        </svg>
                        Extract Text
                    </button>
                </div>
                <div id="ocrStatus" class="hidden text-sm text-green-300/80"></div>
                <div id="ocrRawText" class="hidden">
                    <label class="block text-sm font-semibold text-green-300 mb-2">Extracted Text</label>
                    <textarea id="ocrTextarea" readonly class="w-full px-4 py-3 glass-input rounded-lg text-sm text-green-100 h-32 resize-none outline-none"></textarea>
                </div>
                <div id="ocrParsedSection" class="hidden">
                    <label class="block text-sm font-semibold text-green-300 mb-2">Parsed Attendees (review before saving)</label>
                    <div id="ocrParsedList" class="space-y-2 mb-4"></div>
                    <div class="flex gap-3">
                        <button id="saveOcrAttendeesBtn" class="primary-button text-white px-6 py-2.5 font-medium flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                            Save All
                        </button>
                        <button id="cancelOcrBtn" class="glass-button px-6 py-2.5 font-medium flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Attendee Form -->
        <div class="glass-card p-6 mb-8 glow-effect">
            <h2 class="text-2xl font-bold text-green-200 mb-6 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Add Attendee
            </h2>
            <form id="addAttendeeForm" class="space-y-6">
                <div class="space-y-2">
                    <label for="attendeeName" class="block text-sm font-semibold text-green-300">Full Name</label>
                    <input type="text" id="attendeeName" name="attendeeName" required 
                        class="w-full px-4 py-3 glass-input outline-none transition-all"
                        placeholder="e.g., Juan Dela Cruz">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="course" class="block text-sm font-semibold text-green-300">Course</label>
                        <input type="text" id="course" name="course" required 
                            class="w-full px-4 py-3 glass-input outline-none transition-all"
                            placeholder="e.g., BSIT">
                    </div>
                    <div class="space-y-2">
                        <label for="role" class="block text-sm font-semibold text-green-300">Role</label>
                        <input type="text" id="role" name="role" required 
                            class="w-full px-4 py-3 glass-input outline-none transition-all"
                            placeholder="e.g., Student, Speaker, Organizer">
                    </div>
                </div>
                <div class="space-y-2">
                    <label for="dateAttended" class="block text-sm font-semibold text-green-300">Date Attended</label>
                    <input type="date" id="dateAttended" name="dateAttended" required 
                        class="w-full px-4 py-3 glass-input outline-none transition-all">
                </div>
                <button type="submit" 
                    class="w-full primary-button text-white font-semibold py-3">
                    Add Attendee
                </button>
            </form>
        </div>

        <!-- Attendees Counter Panel -->
        <div class="glass-card p-6 mb-8 glow-effect">
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-bold text-green-200">Attendees:</h2>
                <span id="attendeeCount" class="text-4xl font-bold text-green-300">0</span>
            </div>
        </div>

        <!-- Search -->
        <div class="glass-card p-4 mb-4">
            <div class="relative">
                <input type="text" id="attendeesSearch" placeholder="Search attendees..." 
                    class="w-full px-4 py-2.5 glass-input rounded-lg text-sm outline-none pl-10">
                <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-green-300/60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>

        <!-- Attendees Table -->
        <div class="glass-card p-6 overflow-x-auto glow-effect">
            <table class="w-full glass-table">
                <thead>
                    <tr class="border-b-2 border-green-400/30">
                        <th class="text-left py-3 px-2 text-sm font-semibold">Full Name</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold">Course</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold">Role</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold">Date Attended</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold">Status</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold">Certificate ID</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold w-24">Actions</th>
                    </tr>
                </thead>
                <tbody id="attendeesTableBody">
                </tbody>
            </table>
            <p id="noAttendees" class="text-green-300/60 text-center py-8">No attendees yet.</p>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 backdrop-blur-md">
        <div class="glass-card p-8 w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto glow-effect">
            <h2 class="text-2xl font-bold text-green-200 mb-6 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
                Edit Attendee
            </h2>
            <form id="editAttendeeForm" class="space-y-5">
                <input type="hidden" id="editAttendeeId">
                <div class="space-y-2">
                    <label for="editName" class="block text-sm font-semibold text-green-300">Full Name</label>
                    <input type="text" id="editName" required
                        class="w-full px-4 py-3 glass-input outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label for="editCourse" class="block text-sm font-semibold text-green-300">Course</label>
                    <input type="text" id="editCourse" required
                        class="w-full px-4 py-3 glass-input outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label for="editRole" class="block text-sm font-semibold text-green-300">Role</label>
                    <input type="text" id="editRole" required
                        class="w-full px-4 py-3 glass-input outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label for="editDateAttended" class="block text-sm font-semibold text-green-300">Date Attended</label>
                    <input type="date" id="editDateAttended" required
                        class="w-full px-4 py-3 glass-input outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label for="editStatus" class="block text-sm font-semibold text-green-300">Status</label>
                    <select id="editStatus" required
                        class="w-full px-4 py-3 glass-input outline-none transition-all">
                        <option value="present">Present</option>
                        <option value="absent">Absent</option>
                        <option value="late">Late</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" 
                        class="flex-1 primary-button text-white font-semibold py-3 rounded-lg">
                        Save Changes
                    </button>
                    <button type="button" onclick="window.closeEditModal()" 
                        class="flex-1 glass-button py-3 rounded-lg">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import '../PopupSystem.js';
        import './AttendeeManagement.js';
    </script>
</body>
</html>
