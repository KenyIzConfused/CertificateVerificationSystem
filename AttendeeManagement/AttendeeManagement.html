<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Unit: Manage Attendees</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-accent': '#10b981',
                        'emerald': '#10b981',
                        'mint': '#84cc95',
                        'jade': '#22c55e',
                        'teal': '#0d9488'
                    }
                }
            }
        }
    </script>
    <style>
        /* Solid Dark Green Background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, #16a34a, #15803d, #166534);
        }

        /* Floating Liquid Shapes for Depth */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 15% 20%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 85% 80%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(13, 148, 136, 0.08) 0%, transparent 50%);
            filter: blur(80px);
            animation: float 30s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            33% { transform: translateY(-30px) scale(1.05); }
            66% { transform: translateY(20px) scale(0.95); }
        }

        /* Liquid Glass Panel - Translucent */
        .liquid-panel {
            background: rgba(22, 163, 74, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
        }

        /* Solid 3D Green Button */
        .btn-3d {
            background: linear-gradient(145deg, #34d399, #22c55e, #16a34a);
            border: none;
            border-radius: 0.75rem;
            color: white;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 
                0 4px 0 #16a34a,
                0 8px 15px rgba(34, 197, 94, 0.3);
            transform: translateY(0);
        }

        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0 #16a34a,
                0 12px 20px rgba(34, 197, 94, 0.4);
        }

        .btn-glass {
            background: rgba(22, 163, 74, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 0.75rem;
            color: #e0f2fe;
            transition: all 0.2s ease;
        }

        .btn-glass:hover {
            background: rgba(22, 163, 74, 0.25);
            transform: translateY(-1px);
        }

        /* Input Fields */
        .liquid-input {
            background: rgba(22, 163, 74, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 0.75rem;
            color: #f0fdf4;
            transition: all 0.3s ease;
        }

        .liquid-input::placeholder {
            color: #a7f3d0;
        }

        .liquid-input:focus {
            background: rgba(22, 163, 74, 0.25);
            border-color: rgba(34, 197, 94, 0.6);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
            color: #ffffff;
        }

        .liquid-glow {
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.2);
        }

        .liquid-table {
            background: rgba(22, 163, 74, 0.08);
        }

        .action-item {
            background: rgba(22, 163, 74, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 0.5rem;
        }

        .action-item:hover {
            background: rgba(22, 163, 74, 0.2);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-600 to-green-800 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <header class="liquid-panel mb-8 p-6 flex flex-col lg:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold text-green-100">Manage Attendees</h1>
                <p id="eventInfo" class="text-green-200/70 mt-1"></p>
            </div>
            <div class="flex flex-wrap gap-3">
                <button id="exportAttendeesBtn" class="btn-glass px-5 py-2.5 font-medium flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Export to Excel
                </button>
                <a href="../EventCRUD/EventCRUD.html" class="btn-glass px-5 py-2.5 font-medium flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Back to Events
                </a>
            </div>
        </header>

        <!-- Add Attendee Form -->
        <div class="liquid-panel p-6 mb-8 liquid-glow">
            <h2 class="text-2xl font-bold text-green-100 mb-6 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Add Attendee
            </h2>
            <p class="text-green-200/60 text-xs mb-4">Fill in attendee details below. A unique 7-character certificate ID will be generated automatically.</p>
            <form id="addAttendeeForm" class="space-y-6">
                <div class="space-y-2">
                    <label for="attendeeName" class="block text-sm font-semibold text-green-200">Full Name</label>
                    <input type="text" id="attendeeName" name="attendeeName" required 
                        class="w-full px-4 py-3 liquid-input outline-none transition-all"
                        placeholder="e.g., Juan Dela Cruz">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="course" class="block text-sm font-semibold text-green-200">Course</label>
                        <input type="text" id="course" name="course" required 
                            class="w-full px-4 py-3 liquid-input outline-none transition-all"
                            placeholder="e.g., BSIT">
                    </div>
                    <div class="space-y-2">
                        <label for="role" class="block text-sm font-semibold text-green-200">Role</label>
                        <input type="text" id="role" name="role" required 
                            class="w-full px-4 py-3 liquid-input outline-none transition-all"
                            placeholder="e.g., Student, Speaker, Organizer">
                    </div>
                </div>
                <button type="submit" class="w-full btn-3d text-white font-semibold py-3.5">
                    Add Attendee
                </button>
            </form>
        </div>

        <!-- Attendees Counter Panel -->
        <div class="liquid-panel p-6 mb-8 liquid-glow">
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-bold text-green-100">Attendees:</h2>
                <span id="attendeeCount" class="text-4xl font-bold text-green-200">0</span>
            </div>
        </div>

        <!-- Search -->
        <div class="liquid-panel p-4 mb-4">
            <div class="relative">
                <input type="text" id="attendeesSearch" placeholder="Search attendees..." 
                    class="w-full px-4 py-2.5 liquid-input rounded-lg text-sm outline-none pl-10">
                <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-green-200/60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>

        <!-- Attendees Table -->
        <div class="liquid-panel p-6 overflow-x-auto liquid-glow">
            <table class="w-full liquid-table">
                <thead>
                    <tr class="border-b-2 border-green-400/30">
                        <th class="text-left py-3 px-2 text-sm font-semibold text-green-100">Full Name</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold text-green-100">Course</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold text-green-100">Role</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold text-green-100">Date Attended</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold text-green-100">Status</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold text-green-100">Certificate ID</th>
                        <th class="text-left py-3 px-2 text-sm font-semibold text-green-100 w-32">Actions</th>
                    </tr>
                </thead>
                <tbody id="attendeesTableBody">
                </tbody>
            </table>
            <p id="noAttendees" class="text-green-200/60 text-center py-8">No attendees yet.</p>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 backdrop-blur-md">
        <div class="liquid-panel p-8 w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto liquid-glow">
            <h2 class="text-2xl font-bold text-green-100 mb-6 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
                Edit Attendee
            </h2>
            <form id="editAttendeeForm" class="space-y-5">
                <input type="hidden" id="editAttendeeId">
                <div class="space-y-2">
                    <label for="editName" class="block text-sm font-semibold text-green-200">Full Name</label>
                    <input type="text" id="editName" required
                        class="w-full px-4 py-3 liquid-input outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label for="editCourse" class="block text-sm font-semibold text-green-200">Course</label>
                    <input type="text" id="editCourse" required
                        class="w-full px-4 py-3 liquid-input outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label for="editRole" class="block text-sm font-semibold text-green-200">Role</label>
                    <input type="text" id="editRole" required
                        class="w-full px-4 py-3 liquid-input outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label for="editDateAttended" class="block text-sm font-semibold text-green-200">Date Attended</label>
                    <input type="date" id="editDateAttended" 
                        class="w-full px-4 py-3 liquid-input outline-none transition-all" readonly>
                </div>
                <div class="space-y-2">
                    <label for="editStatus" class="block text-sm font-semibold text-green-200">Status</label>
                    <select id="editStatus" required
                        class="w-full px-4 py-3 liquid-input outline-none transition-all">
                        <option value="">Set Status</option>
                        <option value="present">Present</option>
                        <option value="absent">Absent</option>
                        <option value="late">Late</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" 
                        class="flex-1 btn-3d text-white font-semibold py-3.5 rounded-xl">
                        Save Changes
                    </button>
                    <button type="button" onclick="window.closeEditModal()" 
                        class="flex-1 btn-glass py-3.5 rounded-xl">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <p class="text-center text-green-200/50 text-sm mt-4 pb-4">Information Unit @ 2025</p>

    <script type="module">
        import '../PopupSystem.js';
        import './AttendeeManagement.js';
    </script>
</body>
</html>
