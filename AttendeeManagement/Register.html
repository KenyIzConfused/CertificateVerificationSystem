<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Students</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-light': '#86efac'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="app-page min-h-screen p-0 text-brand-900 antialiased">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold bg-gradient-to-r from-green-600 to-green-500 bg-clip-text text-transparent">Register Students</h1>
                <p class="text-gray-600 mt-1">Register students for faster event attendance tracking</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="./AttendeeManagement.html" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors text-sm font-medium shadow-md">
                    ← Back to Manage Attendees
                </a>
            </div>
        </header>
        <div id="registerWrapper" class="bg-white rounded-2xl shadow-xl p-6 mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Add New Student</h2>
            <form id="registerForm" class="space-y-6">
                <div class="space-y-2">
                    <label for="studentName" class="block text-sm font-semibold text-gray-700">Name</label>
                    <input type="text" id="studentName" name="studentName" required
                        class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none"
                        placeholder="e.g., Juan Dela Cruz">
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">Course</label>
                    <select id="studentCourse" name="studentCourse" required 
                        class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none">
                        <option value="">Select Course</option>
                        <option value="BSCS">BSCS</option>
                        <option value="BSIS">BSIS</option>
                        <option value="BSIT">BSIT</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">Major & Year</label>
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label for="studentMajor" class="block text-xs text-gray-500 mb-1">Major</label>
                            <select id="studentMajor" name="studentMajor" required 
                                class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none">
                                <option value="">Select Major</option>
                            </select>
                        </div>
                        <div class="w-32">
                            <label for="studentYear" class="block text-xs text-gray-500 mb-1">Year</label>
                            <select id="studentYear" name="studentYear" required 
                                class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none">
                                <option value="">Select Year</option>
                                <option value="1A">1A</option>
                                <option value="1B">1B</option>
                                <option value="1C">1C</option>
                                <option value="1D">1D</option>
                                <option value="2A">2A</option>
                                <option value="2B">2B</option>
                                <option value="2C">2C</option>
                                <option value="2D">2D</option>
                                <option value="3A">3A</option>
                                <option value="3B">3B</option>
                                <option value="3C">3C</option>
                                <option value="3D">3D</option>
                                <option value="4A">4A</option>
                                <option value="4B">4B</option>
                                <option value="4C">4C</option>
                                <option value="4D">4D</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="space-y-2">
                    <label for="studentIdNumber" class="block text-sm font-semibold text-gray-700">ID Number</label>
                    <input type="text" id="studentIdNumber" name="studentIdNumber" required
                        class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none"
                        placeholder="e.g., 2021-12345">
                </div>
                <button type="submit" 
                    class="w-full bg-gradient-to-r from-green-600 to-green-500 hover:from-green-700 hover:to-green-600 text-white font-semibold py-3 rounded-lg transition-all transform hover:scale-[1.02] shadow-lg hover:shadow-green-200">
                    Register Student
                </button>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Registered Students (<span id="registeredCount">0</span>)</h2>
            <input type="text" id="searchStudents" placeholder="Search students by name or ID..." 
                class="w-full px-4 py-2 border border-green-200 rounded-lg mb-4 text-sm focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
            <div class="overflow-x-auto max-h-96 overflow-y-auto">
                <table class="w-full">
                    <thead>
                        <tr class="border-b-2 border-green-200 bg-white sticky top-0">
                            <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Name</th>
                            <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">ID Number</th>
                            <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Course</th>
                            <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Major</th>
                            <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Year</th>
                            <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="registeredTableBody">
                    </tbody>
                </table>
                <p id="noRegistered" class="text-gray-500 text-center py-8">No registered students yet.</p>
            </div>
        </div>
    </div>
    <script type="module" src="../ui-enhancements.js"></script>
    <script type="module">
        import '../PopupSystem.js';
        import './Register.js';
    </script>
</body>
</html>
