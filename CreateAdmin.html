<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d', 950: '#052e16' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); }
        .glass { background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(22px); border: 1px solid rgba(255, 255, 255, 0.65); }
        .btn-primary { background: linear-gradient(180deg, #16a34a 0%, #15803d 100%); color: white; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="glass w-full max-w-md rounded-3xl p-8">
        <h2 class="text-2xl font-bold text-brand-900 mb-4">Create System Admin</h2>
        <p class="text-sm text-brand-600 mb-4">This creates an admin with super_admin role (bypasses approval)</p>
        <form id="createAdminForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-brand-700">College/Organization Name</label>
                <input type="text" id="collegeName" required class="w-full px-4 py-2 rounded-lg border border-brand-200 mt-1" placeholder="e.g., CITE">
            </div>
            <div>
                <label class="block text-sm font-semibold text-brand-700">Email</label>
                <input type="email" id="email" required class="w-full px-4 py-2 rounded-lg border border-brand-200 mt-1">
            </div>
            <div class="relative">
                <label class="block text-sm font-semibold text-brand-700">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 rounded-lg border border-brand-200 mt-1 pr-10">
                <button type="button" onclick="togglePassword('password', this)" class="absolute right-3 top-8 text-brand-500 hover:text-brand-700">
                    <svg id="eye-password" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    <svg id="eye-off-password" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l-3.293-3.293m0 0a3 3 0 104.243-4.243l3.293 3.293m-3.293-3.293l3.293 3.293M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                </button>
            </div>
            <button type="submit" class="w-full btn-primary py-2 rounded-lg font-semibold">Create Admin</button>
        </form>
        <div id="result" class="mt-4 text-sm hidden"></div>
    </div>
        <script>
            window.togglePassword = function(fieldId, btn) {
                const input = document.getElementById(fieldId);
                const eyeOpen = btn.querySelector('svg:not([id*="-off"])');
                const eyeOff = btn.querySelector('svg[id*="-off"]');
                if (input.type === 'password') {
                    input.type = 'text';
                    eyeOpen.classList.add('hidden');
                    eyeOff.classList.remove('hidden');
                } else {
                    input.type = 'password';
                    eyeOpen.classList.remove('hidden');
                    eyeOff.classList.add('hidden');
                }
            };
        </script>
        <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCKuHUI87RMQK70Cvxm4YO2Jl1UDdoeAfw",
            authDomain: "certificateverification-8ef83.firebaseapp.com",
            projectId: "certificateverification-8ef83",
            storageBucket: "certificateverification-8ef83.firebasestorage.app",
            messagingSenderId: "797766748638",
            appId: "1:797766748638:web:2b716ec9e7c6f64c27b54f",
            measurementId: "G-19BFPGEFEK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('createAdminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const collegeName = document.getElementById('collegeName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, 'Admin', cred.user.uid), {
                    collegeName, email, role: 'super_admin', status: 'approved', createdAt: new Date()
                });
                document.getElementById('result').innerHTML = `<p class="text-green-600">Created! Email: ${email}</p>`;
            } catch (err) {
                document.getElementById('result').innerHTML = `<p class="text-red-600">${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
