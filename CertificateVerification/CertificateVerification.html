<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-accent': '#10b981',
                        'emerald': '#10b981',
                        'mint': '#84cc95',
                        'jade': '#22c55e',
                        'teal': '#0d9488'
                    }
                }
            }
        }
    </script>
    <style>
        /* Solid Dark Green Background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, #16a34a, #15803d, #166534);
        }

        /* Floating Liquid Shapes for Depth */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 15% 20%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 85% 80%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(13, 148, 136, 0.08) 0%, transparent 50%);
            filter: blur(80px);
            animation: float 30s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            33% { transform: translateY(-30px) scale(1.05); }
            66% { transform: translateY(20px) scale(0.95); }
        }

        /* Liquid Glass Panel - Translucent */
        .liquid-panel {
            background: rgba(22, 163, 74, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
        }

        /* Solid 3D Green Button */
        .btn-3d {
            background: #22c55e;
            background: linear-gradient(145deg, #34d399, #22c55e, #16a34a);
            border: none;
            border-radius: 0.75rem;
            color: white;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 
                0 4px 0 #16a34a,
                0 8px 15px rgba(34, 197, 94, 0.3);
            transform: translateY(0);
        }

        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0 #16a34a,
                0 12px 20px rgba(34, 197, 94, 0.4);
        }

        .btn-3d:active {
            transform: translateY(1px);
            box-shadow: 
                0 2px 0 #16a34a,
                0 4px 8px rgba(34, 197, 94, 0.3);
        }

        /* Input Fields */
        .liquid-input {
            background: rgba(22, 163, 74, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 0.75rem;
            color: #f0fdf4;
            transition: all 0.3s ease;
        }

        .liquid-input::placeholder {
            color: #a7f3d0;
        }

        .liquid-input:focus {
            background: rgba(22, 163, 74, 0.25);
            border-color: rgba(34, 197, 94, 0.6);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
            color: #ffffff;
        }

        .panel-glow {
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.2);
        }

        .result-item {
            background: rgba(22, 163, 74, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-600 to-green-800 min-h-screen flex items-center justify-center p-4">
    <a href="../logIn/LogInAdmin.html" class="absolute top-6 left-6 btn-3d px-5 py-2.5 font-medium flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4h3V8h2v4h3l-4 4z"></path>
        </svg>
        Admin Login
    </a>
    <div class="w-full max-w-md space-y-6">
        <form id="verifyForm" class="liquid-panel p-8 panel-glow space-y-6">
            <div class="text-center">
                <h2 class="text-3xl font-bold text-green-100 mb-2">Verify Certificate</h2>
                <p class="text-green-200/70 text-sm">Enter certificate ID to validate</p>
            </div>
            <div class="space-y-2">
                <label for="certificateId" class="block text-sm font-semibold text-green-200">Certificate ID</label>
                <input type="text" id="certificateId" name="certificateId" required maxlength="6"
                    class="w-full px-4 py-3 liquid-input outline-none transition-all uppercase"
                    placeholder="Enter 6-character ID">
            </div>
            <button type="submit" class="w-full btn-3d py-3.5 font-semibold">
                Verify Certificate
            </button>
        </form>
        <div id="result" class="hidden liquid-panel p-8 panel-glow space-y-6">
            <div class="text-center pb-4 border-b border-green-400/30">
                <h2 class="text-2xl font-bold text-green-100 mb-1">Certificate Verified ✓</h2>
                <p class="text-green-200/60 text-sm">Valid certificate record found</p>
            </div>
            <div class="grid grid-cols-1 gap-3">
                <div class="result-item">
                    <span class="text-xs font-semibold text-green-200/60 uppercase tracking-wide">Attendee Name</span>
                    <p id="certName" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="result-item">
                    <span class="text-xs font-semibold text-green-200/60 uppercase tracking-wide">Course</span>
                    <p id="certCourse" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="result-item">
                    <span class="text-xs font-semibold text-green-200/60 uppercase tracking-wide">Role</span>
                    <p id="certRole" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="result-item">
                    <span class="text-xs font-semibold text-green-200/60 uppercase tracking-wide">Date Attended</span>
                    <p id="certDateAttended" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="result-item">
                    <span class="text-xs font-semibold text-green-200/60 uppercase tracking-wide">Status</span>
                    <p id="certStatus" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="result-item">
                    <span class="text-xs font-semibold text-green-200/60 uppercase tracking-wide">Certificate ID</span>
                    <p id="certId" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="result-item">
                    <span class="text-xs font-semibold text-green-200/60 uppercase tracking-wide">Event Name</span>
                    <p id="certEvent" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
            </div>
            <p class="text-center text-green-200/50 text-sm pt-2">Information Unit @ 2026</p>
        </div>
    </div>
    <script type="module">
        import '../PopupSystem.js';
        import './CertificateVerification.js';
    </script>
</body>
</html>
