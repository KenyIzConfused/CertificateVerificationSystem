<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-light': '#86efac'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen flex items-center justify-center p-6">
    <a href="../logIn/LogInAdmin.html" class="absolute top-6 left-6 px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors font-medium">Back to Login</a>
    <div class="w-full max-w-md">
        <form id="verifyForm" class="bg-white rounded-2xl shadow-xl p-8 space-y-6">
            <h2 class="text-3xl font-bold text-center bg-gradient-to-r from-green-600 to-green-500 bg-clip-text text-transparent">Verify Certificate</h2>
            <div class="space-y-2">
                <label for="certificateId" class="block text-sm font-semibold text-gray-700">Certificate ID</label>
                <input type="text" id="certificateId" name="certificateId" required maxlength="6"
                    class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none uppercase"
                    placeholder="Enter 6-character Certificate ID">
            </div>
            <button type="submit" 
                class="w-full bg-gradient-to-r from-green-600 to-green-500 hover:from-green-700 hover:to-green-600 text-white font-semibold py-3 rounded-lg transition-all transform hover:scale-[1.02] shadow-lg hover:shadow-green-200">
                Verify
            </button>
        </form>
        <div id="result" class="hidden bg-white rounded-2xl shadow-xl p-8 mt-6">
            <h2 class="text-2xl font-bold text-center bg-gradient-to-r from-green-600 to-green-500 bg-clip-text text-transparent mb-2">Certificate: Verified</h2>
            <div class="space-y-4 mt-4">
                <div>
                    <span class="text-sm font-semibold text-green-600">Attendee Name</span>
                    <p id="certName" class="text-lg font-medium text-gray-800"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-green-600">Event Name</span>
                    <p id="certEvent" class="text-lg font-medium text-gray-800"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-green-600">Course</span>
                    <p id="certCourse" class="text-lg font-medium text-gray-800"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-green-600">Role</span>
                    <p id="certRole" class="text-lg font-medium text-gray-800"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-green-600">Date Attended</span>
                    <p id="certDate" class="text-lg font-medium text-gray-800"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-green-600">Session</span>
                    <p id="certSession" class="text-lg font-medium text-gray-800"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-green-600">Status</span>
                    <p id="certStatus" class="text-lg font-medium text-gray-800"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-green-600">Certificate ID</span>
                    <p id="certId" class="text-lg font-medium text-gray-800"></p>
                </div>
            </div>
            <p class="text-center text-gray-500 mt-6">Information Unit @ 2026</p>
        </div>
    </div>
    <script type="module">
        import '../PopupSystem.js';
        import './CertificateVerification.js';
    </script>
</body>
</html>
