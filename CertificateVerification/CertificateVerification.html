<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-accent': '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        /* Liquid Glass Effect - Dark Green Theme */
        .glass {
            background: rgba(22, 163, 74, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(22, 163, 74, 0.15);
        }
        .glass-card {
            background: rgba(22, 163, 74, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1.25rem;
            box-shadow: 0 4px 16px rgba(22, 163, 74, 0.12);
        }
        .glass-input {
            background: rgba(22, 163, 74, 0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.35);
            border-radius: 0.75rem;
            color: #f0fdf4;
            transition: all 0.3s ease;
        }
        .glass-input::placeholder {
            color: #bbf7d0;
        }
        .glass-input:focus {
            background: rgba(22, 163, 74, 0.32);
            border-color: rgba(34, 197, 94, 0.6);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
            color: #ffffff;
        }
        .glass-button {
            background: rgba(22, 163, 74, 0.28);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            color: #f0fdf4;
        }
        .glass-button:hover {
            background: rgba(22, 163, 74, 0.4);
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
            color: #ffffff;
        }
        .glass-button:active {
            transform: translateY(0);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.25);
        }
        .primary-button {
            background: rgba(34, 197, 94, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.6);
            transition: all 0.3s ease;
        }
        .primary-button:hover {
            background: rgba(34, 197, 94, 1);
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.25);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-900/90 via-green-800/85 to-green-900/95 min-h-screen flex items-center justify-center p-4">
    <a href="../logIn/LogInAdmin.html" class="absolute top-6 left-6 glass-button px-5 py-2.5 font-medium flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4h3V8h2v4h3l-4 4z"></path>
        </svg>
        Admin Login
    </a>
    <div class="w-full max-w-md space-y-6">
        <form id="verifyForm" class="glass-card p-8 glow-effect space-y-6">
            <div class="text-center">
                <h2 class="text-3xl font-bold text-green-200 mb-2">Verify Certificate</h2>
                <p class="text-green-300/70 text-sm">Enter certificate ID to validate</p>
            </div>
            <div class="space-y-2">
                <label for="certificateId" class="block text-sm font-semibold text-green-300">Certificate ID</label>
                <input type="text" id="certificateId" name="certificateId" required maxlength="6"
                    class="w-full px-4 py-3 glass-input outline-none uppercase"
                    placeholder="Enter 6-character ID">
            </div>
            <button type="submit" 
                class="w-full primary-button text-white font-semibold py-3">
                Verify Certificate
            </button>
        </form>
        <div id="result" class="hidden glass-card p-8 glow-effect space-y-6">
            <div class="text-center pb-4 border-b border-green-400/30">
                <h2 class="text-2xl font-bold text-green-200 mb-1">Certificate Verified ✓</h2>
                <p class="text-green-300/60 text-sm">Valid certificate record found</p>
            </div>
            <div class="grid grid-cols-1 gap-4">
                <div class="glass px-4 py-3">
                    <span class="text-xs font-semibold text-green-300/80 uppercase tracking-wide">Attendee Name</span>
                    <p id="certName" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="glass px-4 py-3">
                    <span class="text-xs font-semibold text-green-300/80 uppercase tracking-wide">Course</span>
                    <p id="certCourse" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="glass px-4 py-3">
                    <span class="text-xs font-semibold text-green-300/80 uppercase tracking-wide">Role</span>
                    <p id="certRole" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="glass px-4 py-3">
                    <span class="text-xs font-semibold text-green-300/80 uppercase tracking-wide">Date Attended</span>
                    <p id="certDateAttended" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="glass px-4 py-3">
                    <span class="text-xs font-semibold text-green-300/80 uppercase tracking-wide">Status</span>
                    <p id="certStatus" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="glass px-4 py-3">
                    <span class="text-xs font-semibold text-green-300/80 uppercase tracking-wide">Certificate ID</span>
                    <p id="certId" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
                <div class="glass px-4 py-3">
                    <span class="text-xs font-semibold text-green-300/80 uppercase tracking-wide">Event Name</span>
                    <p id="certEvent" class="text-lg font-medium text-green-100 mt-1"></p>
                </div>
            </div>
            <p class="text-center text-green-300/50 text-sm pt-2">Information Unit @ 2026</p>
        </div>
    </div>
    <script type="module">
        import '../PopupSystem.js';
        import './CertificateVerification.js';
    </script>
</body>
</html>
