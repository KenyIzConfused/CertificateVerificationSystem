<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f6f8fb',
                            100: '#eef2f7',
                            200: '#dde5ef',
                            300: '#c5d3e4',
                            400: '#9bb0ce',
                            500: '#748eb8',
                            600: '#596f9a',
                            700: '#4a5a7d',
                            800: '#3e4a67',
                            900: '#353f53',
                            950: '#1a1f2b'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', 'Arial', 'sans-serif']
                    },
                    backdropBlur: {
                        xs: '2px'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background:
                radial-gradient(at 100% 0%, rgba(120, 142, 184, 0.22), transparent 55%),
                radial-gradient(at 0% 100%, rgba(108, 128, 172, 0.18), transparent 55%),
                linear-gradient(135deg, #f6f8fb 0%, #eef2f7 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 18px 45px -12px rgba(30, 37, 60, 0.18), inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .glass-strong {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 22px 55px -14px rgba(30, 37, 60, 0.22), inset 0 1px 0 rgba(255,255,255,0.95);
        }
        .input-glass {
            background: rgba(255,255,255,0.55);
            border: 1px solid rgba(120,142,184,0.25);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
            transition: all .2s ease;
        }
        .input-glass:focus {
            outline: none;
            border-color: rgba(108,128,172,0.6);
            box-shadow: 0 0 0 4px rgba(108,128,172,0.15), inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .btn-primary {
            background: linear-gradient(180deg, #3a4560 0%, #2b3348 100%);
            color: white;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .btn-secondary {
            background: rgba(255,255,255,0.55);
            border: 1px solid rgba(120,142,184,0.25);
            color: #3a4560;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.75); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-brand-900 antialiased">
    <a href="../logIn/LogInAdmin.html" class="absolute top-6 left-6 px-4 py-2 rounded-xl btn-secondary font-medium">Back to Login</a>
    <div class="w-full max-w-md space-y-6">
        <form id="verifyForm" class="glass rounded-3xl p-8 space-y-6">
            <div class="text-center">
                <div class="mx-auto h-12 w-12 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-bold text-xl shadow-lg mb-4">CV</div>
                <h2 class="text-3xl font-bold tracking-tight text-brand-950">Verify Certificate</h2>
                <p class="mt-2 text-sm text-brand-500">Enter the certificate UUID to verify its authenticity.</p>
            </div>
            <div class="space-y-2">
                <label for="certificateUuid" class="block text-sm font-semibold text-brand-700">Certificate UUID</label>
                <input type="text" id="certificateUuid" name="certificateUuid" required
                    class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400"
                    placeholder="Enter certificate UUID">
            </div>
            <button type="submit"
                class="w-full btn-primary font-semibold py-3 rounded-xl transition-all shadow-lg">
                Verify
            </button>
        </form>
        <div id="result" class="hidden glass-strong rounded-3xl p-8">
            <h2 class="text-2xl font-bold tracking-tight text-brand-950 mb-4">Certificate: Verified</h2>
            <div class="space-y-4">
                <div>
                    <span class="text-sm font-semibold text-brand-600">Attendee Name</span>
                    <p id="certName" class="text-lg font-medium text-brand-900"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-brand-600">Event Name</span>
                    <p id="certEvent" class="text-lg font-medium text-brand-900"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-brand-600">Course</span>
                    <p id="certCourse" class="text-lg font-medium text-brand-900"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-brand-600">Role</span>
                    <p id="certRole" class="text-lg font-medium text-brand-900"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-brand-600">Date Attended</span>
                    <p id="certDate" class="text-lg font-medium text-brand-900"></p>
                </div>
                <div>
                    <span class="text-sm font-semibold text-brand-600">Certificate UUID</span>
                    <p id="certUuid" class="text-lg font-medium text-brand-900 break-all"></p>
                </div>
            </div>
            <p class="text-center text-brand-400 text-sm mt-6">Information Unit @ 2026</p>
        </div>
    </div>
    <script type="module">
        import '../PopupSystem.js';
        import './CertificateVerification.js';
    </script>
</body>
</html>
