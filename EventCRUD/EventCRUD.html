<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Unit: Event CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-accent': '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        /* Liquid Glass Effect - Dark Green Theme */
        .glass {
            background: rgba(22, 163, 74, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(22, 163, 74, 0.15);
        }
        .glass-card {
            background: rgba(22, 163, 74, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1.25rem;
            box-shadow: 0 4px 16px rgba(22, 163, 74, 0.12);
        }
        .glass-input {
            background: rgba(22, 163, 74, 0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.35);
            border-radius: 0.75rem;
            color: #f0fdf4;
            transition: all 0.3s ease;
        }
        .glass-input::placeholder {
            color: #bbf7d0;
        }
        .glass-input:focus {
            background: rgba(22, 163, 74, 0.32);
            border-color: rgba(34, 197, 94, 0.6);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
            color: #ffffff;
        }
        .glass-button {
            background: rgba(22, 163, 74, 0.28);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            color: #f0fdf4;
        }
        .glass-button:hover {
            background: rgba(22, 163, 74, 0.4);
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
            color: #ffffff;
        }
        .glass-button:active {
            transform: translateY(0);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.25);
        }
        .primary-button {
            background: rgba(34, 197, 94, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.6);
            transition: all 0.3s ease;
        }
        .primary-button:hover {
            background: rgba(34, 197, 94, 1);
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.25);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-900/90 via-green-800/85 to-green-900/95 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <header class="relative mb-8 min-h-[5rem]">
            <a href="./Settings.html" 
                class="absolute left-0 top-0 glass-button px-4 py-2.5 font-medium flex items-center gap-2 z-10"
                aria-label="Settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.54.167 3.54 1.962 0 1.097.573 2.063 1.49 2.535 1.64.847 1.64 3.185 0 4.032a2.718 2.718 0 00-1.49 2.535c0 1.795-1.997 2.902-3.54 1.962a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.54-.167-3.54-1.962 0-1.097-.573-2.063-1.49-2.535-1.64-.847-1.64-3.185 0-4.032a2.718 2.718 0 001.49-2.535c0-1.795 1.997-2.902 3.54-1.962a1.724 1.724 0 002.573-1.066z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span class="hidden sm:inline">Settings</span>
            </a>

            <div class="absolute inset-x-0 top-0 flex h-full items-center justify-center px-4 sm:px-8">
                <div class="text-center">
                    <h1 id="departmentName" class="text-4xl md:text-5xl font-bold text-green-200">Information Unit</h1>
                    <p id="adminName" class="text-green-300/70 mt-2 text-base md:text-lg font-semibold"></p>
                </div>
            </div>

            <div class="absolute right-0 top-0 hidden sm:flex items-center gap-4">
                <a href="../SignUp/SignUpAdmin.html" class="glass-button px-4 py-2 font-medium flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m5-12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    Sign Up
                </a>
                <a href="../logIn/LogInAdmin.html" class="glass-button px-4 py-2 font-medium flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4h3V8h2v4h3l-4 4z"></path>
                    </svg>
                    Logout
                </a>
            </div>
        </header>

        <div class="sm:hidden flex justify-center gap-4 mb-6">
            <a href="../SignUp/SignUpAdmin.html" class="glass-button px-4 py-2 font-medium">Sign Up</a>
            <a href="../logIn/LogInAdmin.html" class="glass-button px-4 py-2 font-medium">Logout</a>
        </div>

        <!-- Events Counter Panel -->
        <div class="glass-card p-6 mb-8 glow-effect">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-bold text-green-200">Events:</h2>
                <span id="eventCount" class="text-4xl font-bold text-green-300">0</span>
            </div>
            <button id="showCreateFormBtn" 
                class="w-full primary-button text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Create New Event
            </button>
        </div>

        <!-- Create/Edit Event Form (Hidden by default) -->
        <div id="createEventPanel" class="hidden glass-card p-6 mb-8 glow-effect">
            <h2 id="formTitle" class="text-2xl font-bold text-green-200 mb-6">Create New Event</h2>
            <form id="eventForm" class="space-y-6">
                <input type="hidden" id="editEventId">
                <div class="space-y-2">
                    <label for="eventTitle" class="block text-sm font-semibold text-green-300">Event Title</label>
                    <input type="text" id="eventTitle" name="eventTitle" required 
                        class="w-full px-4 py-3 glass-input outline-none transition-all"
                        placeholder="e.g., Annual Workshop">
                </div>
                <div class="space-y-2">
                    <label for="eventDescription" class="block text-sm font-semibold text-green-300">About the Event</label>
                    <textarea id="eventDescription" name="eventDescription" rows="3" required 
                        class="w-full px-4 py-3 glass-input outline-none transition-all resize-none"
                        placeholder="Describe what the event is about..."></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="eventDate" class="block text-sm font-semibold text-green-300">Date</label>
                        <input type="date" id="eventDate" name="eventDate" required 
                            class="w-full px-4 py-3 glass-input outline-none transition-all">
                    </div>
                    <div class="space-y-2">
                        <label for="eventTime" class="block text-sm font-semibold text-green-300">Time</label>
                        <input type="time" id="eventTime" name="eventTime" required 
                            class="w-full px-4 py-3 glass-input outline-none transition-all">
                    </div>
                </div>
                <div class="space-y-2">
                    <label for="eventLocation" class="block text-sm font-semibold text-green-300">Location</label>
                    <input type="text" id="eventLocation" name="eventLocation" required 
                        class="w-full px-4 py-3 glass-input outline-none transition-all"
                        placeholder="e.g., Main Auditorium, Online (Zoom)">
                </div>
                <div class="space-y-2">
                    <label for="eventDuration" class="block text-sm font-semibold text-green-300">Duration (hours)</label>
                    <input type="number" id="eventDuration" name="eventDuration" min="1" required 
                        class="w-full px-4 py-3 glass-input outline-none transition-all"
                        placeholder="e.g., 8">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" 
                        class="flex-1 primary-button text-white font-semibold py-3 rounded-lg">
                        Create Event
                    </button>
                    <button type="button" id="cancelEditBtn" class="flex-1 glass-button py-3 rounded-lg">
                        Cancel
                    </button>
                </div>
            </form>
            <input type="hidden" id="department">
            <input type="hidden" id="speaker">
        </div>

        <!-- Events Stack -->
        <div>
            <h2 class="text-2xl font-bold text-green-200 mb-6">NVSU Events</h2>
            <div id="eventsStack" class="space-y-4">
                <p id="noEvents" class="text-green-300/60 text-center py-8 glass px-4 py-8 rounded-xl">No events created yet.</p>
            </div>
        </div>
    </div>
    <script type="module" src="EventCRUD.js"></script>
</body>
</html>
