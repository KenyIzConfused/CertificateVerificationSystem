<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Unit: Event CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-light': '#86efac'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <header class="relative mb-8 min-h-[5rem]">
            <a href="./Settings.html" 
                class="absolute left-0 top-0 inline-flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-medium shadow-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 z-10"
                aria-label="Settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.54.167 3.54 1.962 0 1.097.573 2.063 1.49 2.535 1.64.847 1.64 3.185 0 4.032a2.718 2.718 0 00-1.49 2.535c0 1.795-1.997 2.902-3.54 1.962a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.54-.167-3.54-1.962 0-1.097-.573-2.063-1.49-2.535-1.64-.847-1.64-3.185 0-4.032a2.718 2.718 0 001.49-2.535c0-1.795 1.997-2.902 3.54-1.962a1.724 1.724 0 002.573-1.066z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span class="hidden sm:inline">Settings</span>
            </a>


            <div class="absolute inset-x-0 top-0 flex h-full items-center justify-center px-4 sm:px-8">
                <div class="text-center">
                    <h1 id="departmentName" class="text-4xl md:text-5xl font-bold text-green-600">Information Unit</h1>
                    <p id="adminName" class="text-gray-700 mt-2 text-base md:text-lg font-semibold"></p>
                </div>
            </div>

            <div class="absolute right-0 top-0 hidden sm:flex items-center gap-4">
                <a href="../SignUp/SignUpAdmin.html" class="text-green-700 hover:text-green-800 font-medium">Sign Up New Account</a>
                <a href="../logIn/LogInAdmin.html" class="text-green-700 hover:text-green-800 font-medium">Logout</a>
            </div>
        </header>

        <div class="sm:hidden flex justify-center gap-4 mb-6">
            <a href="../SignUp/SignUpAdmin.html" class="text-green-700 hover:text-green-800 font-medium">Sign Up New Account</a>
            <a href="../logIn/LogInAdmin.html" class="text-green-700 hover:text-green-800 font-medium">Logout</a>
        </div>

        <!-- Events Counter Panel -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8">
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-bold text-gray-800">Events:</h2>
                <span id="eventCount" class="text-4xl font-bold text-green-600">0</span>
            </div>
                <button id="showCreateFormBtn" 
                    class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition-colors shadow-lg flex items-center justify-center gap-2">
                <span class="text-2xl">+</span> Create New Event
            </button>
        </div>

        <!-- Create/Edit Event Form (Hidden by default) -->
        <div id="createEventPanel" class="hidden bg-white rounded-2xl shadow-xl p-6 mb-8">
            <h2 id="formTitle" class="text-2xl font-bold text-gray-800 mb-6">Create New Event</h2>
            <form id="eventForm" class="space-y-6">
                <input type="hidden" id="editEventId">
                <div class="space-y-2">
                    <label for="eventTitle" class="block text-sm font-semibold text-gray-700">Event Title</label>
                    <input type="text" id="eventTitle" name="eventTitle" required 
                        class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none"
                        placeholder="e.g., Annual Workshop">
                </div>
                <div class="space-y-2">
                    <label for="eventDescription" class="block text-sm font-semibold text-gray-700">About the Event</label>
                    <textarea id="eventDescription" name="eventDescription" rows="3" required 
                        class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none resize-none"
                        placeholder="Describe what the event is about..."></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="eventDate" class="block text-sm font-semibold text-gray-700">Date</label>
                        <input type="date" id="eventDate" name="eventDate" required 
                            class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none">
                    </div>
                    <div class="space-y-2">
                        <label for="eventTime" class="block text-sm font-semibold text-gray-700">Time</label>
                        <input type="time" id="eventTime" name="eventTime" required 
                            class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none">
                    </div>
                </div>
                <div class="space-y-2">
                    <label for="eventLocation" class="block text-sm font-semibold text-gray-700">Location</label>
                    <input type="text" id="eventLocation" name="eventLocation" required 
                        class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none"
                        placeholder="e.g., Main Auditorium, Online (Zoom)">
                </div>
                <div class="space-y-2">
                    <label for="eventDuration" class="block text-sm font-semibold text-gray-700">Duration (hours)</label>
                    <input type="number" id="eventDuration" name="eventDuration" min="1" required 
                        class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none"
                        placeholder="e.g., 8">
                </div>
                <button type="submit" 
                    class="w-full bg-gradient-to-r from-green-600 to-green-500 hover:from-green-700 hover:to-green-600 text-white font-semibold py-3 rounded-lg transition-all transform hover:scale-[1.02] shadow-lg hover:shadow-green-200">
                    Create Event
                </button>
            </form>
        </div>

        <!-- Events Stack -->
        <div>
            <h2 class="text-2xl font-bold text-gray-800 mb-6">NVSU Events</h2>
            <div id="eventsStack" class="space-y-4">
                <p id="noEvents" class="text-gray-500 text-center py-8">No events created yet.</p>
            </div>
        </div>
    </div>
    <script type="module" src="EventCRUD.js"></script>
</body>
</html>
