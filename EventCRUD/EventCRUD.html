<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Unit: Event CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f6f8fb',
                            100: '#eef2f7',
                            200: '#dde5ef',
                            300: '#c5d3e4',
                            400: '#9bb0ce',
                            500: '#748eb8',
                            600: '#596f9a',
                            700: '#4a5a7d',
                            800: '#3e4a67',
                            900: '#353f53',
                            950: '#1a1f2b'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', 'Arial', 'sans-serif']
                    },
                    backdropBlur: {
                        xs: '2px'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background:
                radial-gradient(at 0% 0%, rgba(120, 142, 184, 0.22), transparent 55%),
                radial-gradient(at 90% 10%, rgba(160, 180, 210, 0.18), transparent 55%),
                radial-gradient(at 100% 100%, rgba(120, 140, 178, 0.18), transparent 55%),
                linear-gradient(135deg, #f6f8fb 0%, #eef2f7 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 18px 45px -12px rgba(30, 37, 60, 0.18), inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .glass-strong {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 22px 55px -14px rgba(30, 37, 60, 0.22), inset 0 1px 0 rgba(255,255,255,0.95);
        }
        .input-glass {
            background: rgba(255,255,255,0.55);
            border: 1px solid rgba(120,142,184,0.25);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
            transition: all .2s ease;
        }
        .input-glass:focus {
            outline: none;
            border-color: rgba(108,128,172,0.6);
            box-shadow: 0 0 0 4px rgba(108,128,172,0.15), inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .btn-primary {
            background: linear-gradient(180deg, #3a4560 0%, #2b3348 100%);
            color: white;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .btn-secondary {
            background: rgba(255,255,255,0.55);
            border: 1px solid rgba(120,142,184,0.25);
            color: #3a4560;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.75); }
        .event-card {
            background: rgba(255,255,255,0.78);
            backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 14px 40px -10px rgba(30, 37, 60, 0.18), inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .badge-glass {
            background: rgba(255,255,255,0.65);
            border: 1px solid rgba(120,142,184,0.25);
            backdrop-filter: blur(14px);
        }
    </style>
</head>
<body class="min-h-screen p-6 text-brand-900 antialiased">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold tracking-tight text-brand-950">Information Unit</h1>
                <p id="adminName" class="text-brand-500 mt-1"></p>
            </div>
            <div class="flex gap-3">
                <a href="../SignUp/SignUpAdmin.html" class="px-4 py-2 rounded-xl btn-secondary text-sm font-medium">Sign Up New Account</a>
                <a href="../logIn/LogInAdmin.html" class="px-4 py-2 rounded-xl btn-secondary text-sm font-medium">Logout</a>
            </div>
        </header>

        <!-- Events Counter Panel -->
        <div class="glass rounded-3xl p-6 mb-8">
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-bold text-brand-900">Events</h2>
                <span id="eventCount" class="text-4xl font-bold text-brand-600">0</span>
            </div>
            <button id="showCreateFormBtn"
                class="mt-4 w-full btn-primary font-semibold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                <span class="text-xl leading-none">+</span> Create New Event
            </button>
        </div>

        <!-- Create Event Form (Hidden by default) -->
        <div id="createEventPanel" class="hidden glass-strong rounded-3xl p-6 mb-8">
            <h2 class="text-2xl font-bold text-brand-900 mb-6">Create New Event</h2>
            <form id="createEventForm" class="space-y-6">
                <div class="space-y-2">
                    <label for="eventTitle" class="block text-sm font-semibold text-brand-700">Event Title</label>
                    <input type="text" id="eventTitle" name="eventTitle" required
                        class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400"
                        placeholder="e.g., Annual Workshop">
                </div>
                <div class="space-y-2">
                    <label for="eventDescription" class="block text-sm font-semibold text-brand-700">About the Event</label>
                    <textarea id="eventDescription" name="eventDescription" rows="3"
                        class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400 resize-none"
                        placeholder="Describe what the event is about..."></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="eventDate" class="block text-sm font-semibold text-brand-700">Date</label>
                        <input type="date" id="eventDate" name="eventDate" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400">
                    </div>
                    <div class="space-y-2">
                        <label for="eventTime" class="block text-sm font-semibold text-brand-700">Time</label>
                        <input type="time" id="eventTime" name="eventTime" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400">
                    </div>
                </div>
                <div class="space-y-2">
                    <label for="eventLocation" class="block text-sm font-semibold text-brand-700">Location</label>
                    <input type="text" id="eventLocation" name="eventLocation" required
                        class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400"
                        placeholder="e.g., Main Auditorium, Online (Zoom)">
                </div>
                <div class="space-y-2">
                    <label for="eventDuration" class="block text-sm font-semibold text-brand-700">Duration (hours)</label>
                    <input type="number" id="eventDuration" name="eventDuration" min="1" required
                        class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400"
                        placeholder="e.g., 8">
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="window.cancelEdit()"
                        class="hidden px-4 py-2 rounded-xl btn-secondary transition-colors" id="cancelEditBtn">
                        Cancel
                    </button>
                    <button type="submit"
                        class="flex-1 btn-primary font-semibold py-3 rounded-xl transition-all shadow-lg">
                        Create Event
                    </button>
                </div>
            </form>
        </div>

        <!-- Events Stack -->
        <div>
            <h2 class="text-2xl font-bold text-brand-900 mb-6">NVSU Events</h2>
            <div id="eventsStack" class="space-y-4">
                <p id="noEvents" class="text-brand-400 text-center py-8">No events created yet.</p>
            </div>
        </div>

        <div class="glass rounded-3xl p-6 mt-8">
            <h2 class="text-xl font-bold text-brand-900 mb-2">Accomplishment Report</h2>
            <p class="text-brand-500 mb-4 text-sm">Generate a Word document report containing each event’s title, description, duration, date, venue, and participant count.</p>
            <button onclick="window.generateAccomplishmentReport()" class="w-full btn-primary font-semibold py-3 rounded-xl transition-all shadow-lg">Generate Accomplishment Report</button>
        </div>
    </div>
    <script type="module">
        import '../PopupSystem.js';
        import './EventCRUD.js';
    </script>
</body>
</html>
