<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Unit: Event CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            950: '#052e16'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', 'Arial', 'sans-serif']
                    },
                    backdropBlur: {
                        xs: '2px'
                    }
                }
            }
        }
    </script>
<style>
        body {
            background:
                radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.22), transparent 55%),
                radial-gradient(at 90% 10%, rgba(74, 222, 128, 0.18), transparent 55%),
                radial-gradient(at 100% 100%, rgba(34, 197, 94, 0.18), transparent 55%),
                linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        }
        
        /* Custom scrollbar for independent scrolling */
        .overflow-y-auto::-webkit-scrollbar {
            width: 8px;
        }
        .overflow-y-auto::-webkit-scrollbar-track {
            background: transparent;
        }
        .overflow-y-auto::-webkit-scrollbar-thumb {
            background: rgba(34, 197, 94, 0.3);
            border-radius: 4px;
        }
        .overflow-y-auto::-webkit-scrollbar-thumb:hover {
            background: rgba(34, 197, 94, 0.5);
        }
    </style>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="app-page min-h-screen p-0 text-brand-900 antialiased">
    <header class="w-full app-header">
        <div class="app-header__inner">
            <div class="flex items-center gap-3 relative">
                <!-- Menu Button -->
                <div class="relative">
                    <button id="menuBtn" class="p-2 rounded-xl bg-white/15 hover:bg-white/25 transition-all duration-200 flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                    <div id="menuDropdown" class="hidden absolute top-12 left-0 bg-white/95 rounded-2xl shadow-xl border border-green-100/50 py-2 w-56 z-[100] backdrop-blur-xl">
                        <button onclick="window.openRegister()" class="w-full text-left px-4 py-3 text-sm font-medium text-gray-700 hover:bg-green-50 hover:text-green-700 transition-colors flex items-center gap-3">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                            </svg>
                            Register Student
                        </button>
                        <button onclick="window.openSettings()" class="w-full text-left px-4 py-3 text-sm font-medium text-gray-700 hover:bg-green-50 hover:text-green-700 transition-colors flex items-center gap-3">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.544 2.272-2.25 3.58-.986.688.674.986 1.76.674 2.697-.31 1.002-1.168 1.71-2.28 1.71H8.574c-.426 0-1.168-.674-2.28-1.71-.31-.88-.013-1.71.674-2.252z"/>
                            </svg>
                            Settings
                        </button>
                    </div>
                </div>
                <div class="brand-text">
                    <span id="headerOrgName" class="brand-title">College Admin</span>
                </div>
            </div>
            <div class="app-header__actions">
                <button onclick="window.handleLogout()" class="header-button dashboard-logout-button">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Layout Container -->
    <div class="flex h-[calc(100vh-88px)] overflow-hidden">
        <!-- Left Sidebar Panel -->
        <aside class="w-80 flex-shrink-0 flex flex-col min-h-0">
<div class="px-4 py-6 space-y-6 min-w-0 flex-1 overflow-y-auto pr-2 min-h-0">
                <!-- Create Event Panel -->
                <div id="createEventPanel" class="glass-strong rounded-2xl p-6">
                    <h2 class="text-xl font-bold text-brand-900 mb-4">Create Event</h2>
                    <form id="createEventForm" class="space-y-4">
                        <div class="space-y-2">
                            <label for="eventTitle" class="block text-sm font-semibold text-brand-700">Event Title</label>
                            <input type="text" id="eventTitle" name="eventTitle" required
                                class="w-full px-3 py-2 rounded-lg input-glass text-brand-900 placeholder:text-brand-400"
                                placeholder="e.g., Annual Workshop">
                        </div>
                        <div class="space-y-2">
                            <label for="eventDescription" class="block text-sm font-semibold text-brand-700">About the Event</label>
                            <textarea id="eventDescription" name="eventDescription" rows="3"
                                class="w-full px-3 py-2 rounded-lg input-glass text-brand-900 placeholder:text-brand-400 resize-none"
                                placeholder="Describe what the event is about..."></textarea>
                        </div>
                        <div class="space-y-2">
                            <label for="eventDate" class="block text-sm font-semibold text-brand-700">Date</label>
                            <input type="date" id="eventDate" name="eventDate" required
                                class="w-full px-3 py-2 rounded-lg input-glass text-brand-900 placeholder:text-brand-400">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-brand-700">Morning Session</label>
                            <div class="grid grid-cols-2 gap-2">
                                <div class="space-y-1">
                                    <label for="morningTimeIn" class="block text-xs text-brand-500">Time In</label>
                                    <input type="time" id="morningTimeIn" name="morningTimeIn" required
                                        class="w-full px-2 py-1.5 rounded-lg input-glass text-brand-900 text-sm">
                                </div>
                                <div class="space-y-1">
                                    <label for="morningTimeOut" class="block text-xs text-brand-500">Time Out</label>
                                    <input type="time" id="morningTimeOut" name="morningTimeOut" required
                                        class="w-full px-2 py-1.5 rounded-lg input-glass text-brand-900 text-sm">
                                </div>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-brand-700">Afternoon Session</label>
                            <div class="grid grid-cols-2 gap-2">
                                <div class="space-y-1">
                                    <label for="afternoonTimeIn" class="block text-xs text-brand-500">Time In</label>
                                    <input type="time" id="afternoonTimeIn" name="afternoonTimeIn" required
                                        class="w-full px-2 py-1.5 rounded-lg input-glass text-brand-900 text-sm">
                                </div>
                                <div class="space-y-1">
                                    <label for="afternoonTimeOut" class="block text-xs text-brand-500">Time Out</label>
                                    <input type="time" id="afternoonTimeOut" name="afternoonTimeOut" required
                                        class="w-full px-2 py-1.5 rounded-lg input-glass text-brand-900 text-sm">
                                </div>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label for="eventLocation" class="block text-sm font-semibold text-brand-700">Location</label>
                            <input type="text" id="eventLocation" name="eventLocation" required
                                class="w-full px-3 py-2 rounded-lg input-glass text-brand-900 placeholder:text-brand-400"
                                placeholder="e.g., Main Auditorium, Online (Zoom)">
                        </div>
                        <div class="flex gap-2">
                            <button type="button" onclick="window.cancelEdit()"
                                class="hidden px-3 py-1.5 rounded-lg btn-secondary transition-colors text-sm" id="cancelEditBtn">
                                Cancel
                            </button>
                            <button type="submit"
                                class="flex-1 btn-primary font-semibold py-2 rounded-lg transition-all shadow-lg text-sm">
                                Create Event
                            </button>
                        </div>
                    </form>
                </div>
 
                <!-- Accomplishment Report Card -->
                <div class="glass rounded-2xl p-6">
                    <h2 class="text-lg font-bold text-brand-900 mb-2">Accomplishment Report</h2>
                    <p class="text-brand-500 mb-3 text-xs">Generate a Word document report containing each event's title, description, duration, date, venue, and participant count.</p>
                    <button onclick="window.generateAccomplishmentReport()" class="w-full btn-primary font-semibold py-2 rounded-lg transition-all shadow-lg text-sm">Generate Report</button>
                </div>
            </div>
        </aside>

        <!-- Right Main Content - Events List -->
        <main class="flex-1 flex flex-col min-h-0">
            <div class="px-4 pt-6">
                <div class="glass rounded-2xl p-4 mb-4 flex items-center justify-between">
                    <h2 class="text-xl font-bold text-brand-900">Created Events</h2>
                    <span id="eventCount" class="text-2xl font-bold text-brand-600">0</span>
                </div>
            </div>
            <div class="px-4 pb-6 flex-1 min-h-0">
                <div class="glass-strong rounded-2xl p-4 flex flex-col h-full">
                    <div id="eventsStack" class="space-y-4 h-full overflow-y-auto pr-2">
                        <p id="noEvents" class="text-brand-400 text-center py-8">No events created yet.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-md mx-4">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Settings</h2>
            <form id="settingsForm" class="space-y-4">
                <div class="space-y-2">
                    <label for="collegeName" id="settingsLabel" class="block text-sm font-semibold text-gray-700">Change Name</label>
                    <input type="text" id="collegeName" 
                        class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none"
                        placeholder="Enter name">
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="submit" 
                        class="flex-1 bg-gradient-to-r from-green-600 to-green-500 hover:from-green-700 hover:to-green-600 text-white font-semibold py-3 rounded-lg transition-all shadow-lg">
                        Save
                    </button>
                    <button type="button" onclick="window.closeSettings()" 
                        class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 rounded-lg transition-all shadow-lg">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="../ui-enhancements.js"></script>
    <script type="module">
        import '../PopupSystem.js';
        import './EventCRUD.js?v=2';
        
        const menuBtn = document.getElementById('menuBtn');
        const menuDropdown = document.getElementById('menuDropdown');
        
        if (menuBtn && menuDropdown) {
          menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuDropdown.classList.toggle('hidden');
          });
          document.addEventListener('click', () => {
            menuDropdown.classList.add('hidden');
          });
          menuDropdown.addEventListener('click', (e) => {
            e.stopPropagation();
          });
        }
    </script>
</body>
</html>
