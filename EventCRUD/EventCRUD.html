<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Unit: Event CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-accent': '#10b981',
                        'emerald': '#10b981',
                        'mint': '#84cc95',
                        'jade': '#22c55e',
                        'teal': '#0d9488'
                    }
                }
            }
        }
    </script>
    <style>
        /* Solid Dark Green Background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, #16a34a, #15803d, #166534);
        }

        /* Floating Liquid Shapes for Depth */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 15% 20%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 85% 80%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(13, 148, 136, 0.08) 0%, transparent 50%);
            filter: blur(80px);
            animation: float 30s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            33% { transform: translateY(-30px) scale(1.05); }
            66% { transform: translateY(20px) scale(0.95); }
        }

        /* Liquid Glass Panel - Translucent */
        .liquid-panel {
            background: rgba(22, 163, 74, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
        }

        /* Solid 3D Green Button */
        .btn-3d {
            background: linear-gradient(145deg, #34d399, #22c55e, #16a34a);
            border: none;
            border-radius: 0.75rem;
            color: white;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 
                0 4px 0 #16a34a,
                0 8px 15px rgba(34, 197, 94, 0.3);
            transform: translateY(0);
        }

        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0 #16a34a,
                0 12px 20px rgba(34, 197, 94, 0.4);
        }

        .btn-3d:active {
            transform: translateY(1px);
            box-shadow: 
                0 2px 0 #16a34a,
                0 4px 8px rgba(34, 197, 94, 0.3);
        }

        /* Secondary Button Style */
        .btn-glass {
            background: rgba(22, 163, 74, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 0.75rem;
            color: #e0f2fe;
            transition: all 0.2s ease;
        }

        .btn-glass:hover {
            background: rgba(22, 163, 74, 0.25);
            transform: translateY(-1px);
        }

        /* Input Fields */
        .liquid-input {
            background: rgba(22, 163, 74, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 0.75rem;
            color: #f0fdf4;
            transition: all 0.3s ease;
        }

        .liquid-input::placeholder {
            color: #a7f3d0;
        }

        .liquid-input:focus {
            background: rgba(22, 163, 74, 0.25);
            border-color: rgba(34, 197, 94, 0.6);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
            color: #ffffff;
        }

        .liquid-glow {
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-600 to-green-800 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <header class="relative mb-8 min-h-[5rem]">
            <!-- Hamburger Menu -->
            <div class="absolute left-0 top-0 z-20">
                <button id="menuBtn" class="btn-glass p-3 rounded-xl flex items-center justify-center" aria-label="Menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                
                <!-- Dropdown Menu -->
                <div id="menuDropdown" class="hidden absolute left-0 mt-2 w-48 liquid-panel rounded-xl p-2 shadow-lg">
                    <a href="./Settings.html" class="flex items-center gap-3 px-4 py-3 text-green-100 hover:bg-green-400/20 rounded-lg transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.54.167 3.54 1.962 0 1.097.573 2.063 1.49 2.535 1.64.847 1.64 3.185 0 4.032a2.718 2.718 0 00-1.49 2.535c0 1.795-1.997 2.902-3.54 1.962a1.724 1.724 0 00-2.573-1.066z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        Settings
                    </a>
                    <a href="../SignUp/SignUpAdmin.html" class="flex items-center gap-3 px-4 py-3 text-green-100 hover:bg-green-400/20 rounded-lg transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m5-12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        Sign Up
                    </a>
                    <a href="../logIn/LogInAdmin.html" class="flex items-center gap-3 px-4 py-3 text-green-100 hover:bg-green-400/20 rounded-lg transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4h3V8h2v4h3l-4 4z"></path>
                        </svg>
                        Logout
                    </a>
                </div>
            </div>

            <div class="absolute inset-x-0 top-0 flex h-full items-center justify-center px-4 sm:px-8">
                <div class="text-center">
                    <h1 id="departmentName" class="text-4xl md:text-5xl font-bold text-green-100">Information Unit</h1>
                    <p id="adminName" class="text-green-200/70 mt-2 text-base md:text-lg font-semibold"></p>
                </div>
            </div>
        </header>

        <!-- Events Counter Panel -->
        <div class="liquid-panel p-6 mb-8 liquid-glow">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-bold text-green-100">Events:</h2>
                <span id="eventCount" class="text-4xl font-bold text-green-200">0</span>
            </div>
            <button id="showCreateFormBtn" 
                class="w-full btn-3d text-white font-semibold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Create New Event
            </button>
        </div>

        <!-- Create/Edit Event Form (Hidden by default) -->
        <div id="createEventPanel" class="hidden liquid-panel p-6 mb-8 liquid-glow">
            <h2 id="formTitle" class="text-2xl font-bold text-green-100 mb-6">Create New Event</h2>
            <form id="eventForm" class="space-y-6">
                <input type="hidden" id="editEventId">
                <div class="space-y-2">
                    <label for="eventTitle" class="block text-sm font-semibold text-green-200">Event Title</label>
                    <input type="text" id="eventTitle" name="eventTitle" required 
                        class="w-full px-4 py-3 liquid-input outline-none transition-all"
                        placeholder="e.g., Annual Workshop">
                </div>
                <div class="space-y-2">
                    <label for="eventDescription" class="block text-sm font-semibold text-green-200">About the Event</label>
                    <textarea id="eventDescription" name="eventDescription" rows="3" required 
                        class="w-full px-4 py-3 liquid-input outline-none transition-all resize-none"
                        placeholder="Describe what the event is about..."></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="eventDate" class="block text-sm font-semibold text-green-200">Date</label>
                        <input type="date" id="eventDate" name="eventDate" required 
                            class="w-full px-4 py-3 liquid-input outline-none transition-all">
                    </div>
                    <div class="space-y-2">
                        <label for="eventTime" class="block text-sm font-semibold text-green-200">Time</label>
                        <input type="time" id="eventTime" name="eventTime" required 
                            class="w-full px-4 py-3 liquid-input outline-none transition-all">
                    </div>
                </div>
                <div class="space-y-2">
                    <label for="eventLocation" class="block text-sm font-semibold text-green-200">Location</label>
                    <input type="text" id="eventLocation" name="eventLocation" required 
                        class="w-full px-4 py-3 liquid-input outline-none transition-all"
                        placeholder="e.g., Main Auditorium, Online (Zoom)">
                </div>
                <div class="space-y-2">
                    <label for="eventDuration" class="block text-sm font-semibold text-green-200">Duration (hours)</label>
                    <input type="number" id="eventDuration" name="eventDuration" min="1" required 
                        class="w-full px-4 py-3 liquid-input outline-none transition-all"
                        placeholder="e.g., 8">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" 
                        class="flex-1 btn-3d text-white font-semibold py-3.5 rounded-xl">
                        Create Event
                    </button>
                    <button type="button" id="cancelEditBtn" class="flex-1 btn-glass py-3.5 rounded-xl">
                        Cancel
                    </button>
                </div>
            </form>
            <input type="hidden" id="department">
            <input type="hidden" id="speaker">
        </div>

        <!-- Events Stack -->
        <div>
            <h2 class="text-2xl font-bold text-green-100 mb-6">NVSU Events</h2>
            <div id="eventsStack" class="space-y-4">
                <p id="noEvents" class="text-green-200/60 text-center py-8 liquid-panel p-6 rounded-xl">No events created yet.</p>
            </div>
        </div>
    </div>
    <script type="module" src="EventCRUD.js"></script>
</body>
</html>
