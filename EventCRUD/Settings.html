<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-light': '#86efac'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen p-6">
    <div class="max-w-2xl mx-auto">
        <header class="mb-8">
            <a href="./EventCRUD.html" class="inline-flex items-center gap-2 text-green-700 hover:text-green-800 font-medium mb-6">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </a>
            <div class="text-center">
                <h1 class="text-4xl font-bold text-green-600">Settings</h1>
                <p class="text-gray-600 mt-2">Manage your department information</p>
            </div>
        </header>

        <form id="settingsForm" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
            <div class="space-y-2">
                <label for="departmentName" class="block text-sm font-semibold text-gray-700">Information Unit / Department Name</label>
                <input type="text" id="departmentName" name="departmentName" required
                    class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none"
                    placeholder="e.g., Information Unit">
            </div>

            <div class="space-y-2">
                <label for="departmentDetails" class="block text-sm font-semibold text-gray-700">Department Details</label>
                <textarea id="departmentDetails" name="departmentDetails" rows="5"
                    class="w-full px-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none resize-none"
                    placeholder="Add department details here for future use..."></textarea>
                <p class="text-sm text-gray-500">These details are saved for future dashboard updates and do not affect existing events.</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-4">
                <button type="submit"
                    class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition-colors shadow-lg">
                    Save Settings
                </button>
                <a href="./EventCRUD.html"
                    class="flex-1 text-center px-4 py-3 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition-colors font-semibold">
                    Cancel
                </a>
            </div>
        </form>
    </div>
    <script type="module">
        import '../PopupSystem.js';
        import './Settings.js';
    </script>
</body>
</html>
