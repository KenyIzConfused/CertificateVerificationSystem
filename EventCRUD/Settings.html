<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'green-primary': '#22c55e',
                        'green-dark': '#16a34a',
                        'green-accent': '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        /* Liquid Glass Effect - Dark Green Theme */
        .glass {
            background: rgba(22, 163, 74, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(22, 163, 74, 0.15);
        }
        .glass-card {
            background: rgba(22, 163, 74, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1.25rem;
            box-shadow: 0 4px 16px rgba(22, 163, 74, 0.12);
        }
        .glass-input {
            background: rgba(22, 163, 74, 0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.35);
            border-radius: 0.75rem;
            color: #f0fdf4;
            transition: all 0.3s ease;
        }
        .glass-input::placeholder {
            color: #bbf7d0;
        }
        .glass-input:focus {
            background: rgba(22, 163, 74, 0.32);
            border-color: rgba(34, 197, 94, 0.6);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
            color: #ffffff;
        }
        .glass-button {
            background: rgba(22, 163, 74, 0.28);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            color: #f0fdf4;
        }
        .glass-button:hover {
            background: rgba(22, 163, 74, 0.4);
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
            color: #ffffff;
        }
        .glass-button:active {
            transform: translateY(0);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.25);
        }
        .primary-button {
            background: rgba(34, 197, 94, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.6);
            transition: all 0.3s ease;
        }
        .primary-button:hover {
            background: rgba(34, 197, 94, 1);
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.25);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-900/90 via-green-800/85 to-green-900/95 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-xl">
        <div class="mb-8 text-center">
            <a href="./EventCRUD.html" class="glass-button px-4 py-2.5 font-medium inline-flex items-center gap-2 mb-6">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </a>
            <h1 class="text-4xl font-bold text-green-200 mb-2">Settings</h1>
            <p class="text-green-300/60">Manage your department information</p>
        </div>

        <form id="settingsForm" class="glass-card p-8 glow-effect space-y-6">
            <div class="space-y-2">
                <label for="departmentName" class="block text-sm font-semibold text-green-300">Information Unit / Department Name</label>
                <input type="text" id="departmentName" name="departmentName" required
                    class="w-full px-4 py-3 glass-input outline-none transition-all"
                    placeholder="e.g., Information Unit">
            </div>

            <div class="space-y-2">
                <label for="departmentDetails" class="block text-sm font-semibold text-green-300">Department Details</label>
                <textarea id="departmentDetails" name="departmentDetails" rows="5"
                    class="w-full px-4 py-3 glass-input outline-none transition-all resize-none"
                    placeholder="Add department details here for future use..."></textarea>
                <p class="text-sm text-green-300/50">These details are saved for future dashboard updates and do not affect existing events.</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button type="submit"
                    class="flex-1 primary-button text-white font-semibold py-3 rounded-lg">
                    Save Settings
                </button>
                <a href="./EventCRUD.html"
                    class="flex-1 text-center glass-button py-3 font-semibold">
                    Cancel
                </a>
            </div>
        </form>
    </div>
    <script type="module">
        import '../PopupSystem.js';
        import './Settings.js';
    </script>
</body>
</html>
