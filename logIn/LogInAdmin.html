<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            950: '#052e16'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', 'Arial', 'sans-serif']
                    },
                    backdropBlur: {
                        xs: '2px'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background:
                radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.22), transparent 55%),
                radial-gradient(at 100% 100%, rgba(22, 163, 74, 0.18), transparent 55%),
                linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 18px 45px -12px rgba(30, 37, 60, 0.18), inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .input-glass {
            background: rgba(255,255,255,0.55);
            border: 1px solid rgba(34, 197, 94, 0.25);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
            transition: all .2s ease;
        }
        .input-glass:focus {
            outline: none;
            border-color: rgba(22, 163, 74, 0.6);
            box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.15), inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .btn-primary {
            background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
            color: white;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .admin-form { display: none; }
        .admin-form.active { display: block; }
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="auth-page min-h-screen p-6 text-brand-900 antialiased">
    <div id="loginContainer" class="glass w-full max-w-md rounded-3xl p-8">
        <div class="mb-2 text-center">
            <div class="mx-auto h-12 w-12 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-bold text-xl shadow-lg mb-4">CV</div>
            <h2 id="formTitle" class="text-3xl font-bold tracking-tight text-brand-950">College Admin Login</h2>
        </div>
        
        <div class="form-section active" id="collegeAdminSection">
            <div id="collegeLoginForm" class="admin-form active">
                <form id="collegeLoginFormElement" class="mt-8 space-y-5">
                    <div class="space-y-2">
                        <label for="collegeEmail" class="block text-sm font-semibold text-brand-700">Email</label>
                        <input type="email" id="collegeEmail" name="email" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400">
                    </div>
                    <div class="space-y-2 relative">
                        <label for="collegePassword" class="block text-sm font-semibold text-brand-700">Password</label>
                        <input type="password" id="collegePassword" name="password" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400 pr-12">
                        <button type="button" onclick="togglePasswordVisibility('collegePassword', this)" class="absolute right-3 top-8 text-brand-500 hover:text-brand-700">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                    <button type="submit"
                        class="w-full btn-primary font-semibold py-3 rounded-xl transition-all shadow-lg">
                        Login
                    </button>
                </form>
                <div class="mt-4 text-center">
                    <button type="button" onclick="switchToSignUp('college')" class="text-sm text-brand-600 hover:text-brand-700">Sign Up</button>
                </div>
            </div>
            
            <div id="collegeSignUpForm" class="admin-form">
                <form id="collegeSignUpFormElement" class="mt-8 space-y-5">
                    <div class="space-y-2">
                        <label for="collegeName" class="block text-sm font-semibold text-brand-700">College Name</label>
                        <input type="text" id="collegeName" name="collegeName" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400"
                            placeholder="e.g., CITE(College of Information Technology Education)">
                    </div>
                    <div class="space-y-2">
                        <label for="collegeSignUpEmail" class="block text-sm font-semibold text-brand-700">Email</label>
                        <input type="email" id="collegeSignUpEmail" name="email" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400">
                    </div>
                    <div class="space-y-2 relative">
                        <label for="collegeSignUpPassword" class="block text-sm font-semibold text-brand-700">Password</label>
                        <input type="password" id="collegeSignUpPassword" name="password" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400 pr-12">
                    </div>
                    <div class="space-y-2 relative">
                        <label for="collegeSignUpConfirmPassword" class="block text-sm font-semibold text-brand-700">Confirm Password</label>
                        <input type="password" id="collegeSignUpConfirmPassword" name="confirmPassword" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400 pr-12">
                    </div>
                    <button type="submit"
                        class="w-full btn-primary font-semibold py-3 rounded-xl transition-all shadow-lg">
                        Sign Up
                    </button>
                </form>
                <div class="mt-4 text-center">
                    <button type="button" onclick="switchToLogin('college')" class="text-sm text-brand-600 hover:text-brand-700">Back to Login</button>
                </div>
            </div>
        </div>

        <div class="form-section" id="systemAdminSection">
            <div id="systemLoginForm" class="admin-form">
                <form id="systemLoginFormElement" class="mt-8 space-y-5">
                    <div class="space-y-2">
                        <label for="systemEmail" class="block text-sm font-semibold text-brand-700">Email</label>
                        <input type="email" id="systemEmail" name="email" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400">
                    </div>
                    <div class="space-y-2 relative">
                        <label for="systemPassword" class="block text-sm font-semibold text-brand-700">Password</label>
                        <input type="password" id="systemPassword" name="password" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400 pr-12">
                    </div>
                    <button type="submit"
                        class="w-full btn-primary font-semibold py-3 rounded-xl transition-all shadow-lg">
                        Login
                    </button>
                </form>
                <div class="mt-4 text-center">
                    <button type="button" onclick="switchToSignUp('system')" class="text-sm text-brand-600 hover:text-brand-700">Sign Up</button>
                </div>
            </div>
            
            <div id="systemSignUpForm" class="admin-form">
                <form id="systemSignUpFormElement" class="mt-8 space-y-5">
                    <div class="space-y-2">
                        <label for="systemFullName" class="block text-sm font-semibold text-brand-700">Full Name</label>
                        <input type="text" id="systemFullName" name="fullName" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400"
                            placeholder="Full Name">
                    </div>
                    <div class="space-y-2">
                        <label for="systemSignUpEmail" class="block text-sm font-semibold text-brand-700">Email</label>
                        <input type="email" id="systemSignUpEmail" name="email" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400">
                    </div>
                    <div class="space-y-2 relative">
                        <label for="systemSignUpPassword" class="block text-sm font-semibold text-brand-700">Password</label>
                        <input type="password" id="systemSignUpPassword" name="password" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400 pr-12">
                    </div>
                    <div class="space-y-2 relative">
                        <label for="systemSignUpConfirmPassword" class="block text-sm font-semibold text-brand-700">Confirm Password</label>
                        <input type="password" id="systemSignUpConfirmPassword" name="confirmPassword" required
                            class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400 pr-12">
                    </div>
                    <button type="submit"
                        class="w-full btn-primary font-semibold py-3 rounded-xl transition-all shadow-lg">
                        Sign Up
                    </button>
                </form>
                <div class="mt-4 text-center">
                    <button type="button" onclick="switchToLogin('system')" class="text-sm text-brand-600 hover:text-brand-700">Back to Login</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../ui-enhancements.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { showAlert, showToast, showLoading, hideLoading } from '../PopupSystem.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCKuHUI87RMQK70Cvxm4YO2Jl1UDdoeAfw",
            authDomain: "certificateverification-8ef83.firebaseapp.com",
            projectId: "certificateverification-8ef83",
            storageBucket: "certificateverification-8ef83.firebasestorage.app",
            messagingSenderId: "797766748638",
            appId: "1:797766748638:web:2b716ec9e7c6f64c27b54f",
            measurementId: "G-19BFPGEFEK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentAdminType = 'college';
        let currentFormType = 'login';

        function togglePasswordVisibility(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        window.switchAdminView = function(view) {
            currentAdminType = view;
            currentFormType = 'login';
            document.getElementById('collegeAdminSection').classList.toggle('active', view === 'college');
            document.getElementById('systemAdminSection').classList.toggle('active', view === 'system');
            document.getElementById('collegeLoginForm').classList.add('active');
            document.getElementById('collegeSignUpForm').classList.remove('active');
            document.getElementById('systemLoginForm').classList.add('active');
            document.getElementById('systemSignUpForm').classList.remove('active');
            document.getElementById('formTitle').textContent = view === 'college' ? 'College Admin Login' : 'System Admin Login';
            
            const toggleBtn = document.getElementById('adminToggleBtn');
            const headerTitle = document.querySelector('.brand-title');
            if (toggleBtn) toggleBtn.textContent = view === 'college' ? 'System Admin' : 'College Admin';
            if (headerTitle) headerTitle.textContent = view === 'college' ? 'College Admin' : 'System Admin';
        }

        window.switchToSignUp = function(adminType) {
            currentFormType = 'signup';
            document.getElementById(adminType + 'LoginForm').classList.remove('active');
            document.getElementById(adminType + 'SignUpForm').classList.add('active');
            document.getElementById('formTitle').textContent = adminType === 'college' ? 'College Admin Sign Up' : 'System Admin Sign Up';
        }

        window.switchToLogin = function(adminType) {
            currentFormType = 'login';
            document.getElementById(adminType + 'SignUpForm').classList.remove('active');
            document.getElementById(adminType + 'LoginForm').classList.add('active');
            document.getElementById('formTitle').textContent = adminType === 'college' ? 'College Admin Login' : 'System Admin Login';
        }

        // Form handlers
        document.getElementById('collegeLoginFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('collegeEmail').value;
            const password = document.getElementById('collegePassword').value;
            
            try {
                showLoading('login');
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const adminDoc = await getDoc(doc(db, 'Admin', userCredential.user.uid));
                if (!adminDoc.exists()) {
                    hideLoading('login');
                    showAlert('Account not found', { type: 'error' });
                    await auth.signOut();
                    return;
                }
                const adminData = adminDoc.data();
                if (adminData.status === 'pending') {
                    hideLoading('login');
                    showAlert('Account pending approval', { type: 'warning' });
                    await auth.signOut();
                    return;
                }
                if (adminData.role === 'super_admin') {
                    hideLoading('login');
                    showAlert('Please use Super Admin view', { type: 'info' });
                    await auth.signOut();
                    return;
                }
                sessionStorage.setItem('adminLoggedIn', 'true');
                if (adminData.collegeName) localStorage.setItem('orgName', adminData.collegeName);
                hideLoading('login');
                showToast('Login successful!');
                window.location.href = '../EventCRUD/EventCRUD.html';
            } catch (error) {
                hideLoading('login');
                showAlert('Login failed: ' + error.message, { type: 'error' });
            }
        });

        document.getElementById('systemLoginFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('systemEmail').value;
            const password = document.getElementById('systemPassword').value;
            
            try {
                showLoading('login');
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const adminDoc = await getDoc(doc(db, 'Admin', userCredential.user.uid));
                if (adminDoc.exists() && adminDoc.data().role === 'super_admin') {
                    sessionStorage.setItem('superAdminLoggedIn', 'true');
                    hideLoading('login');
                    showToast('Login successful!');
                    window.location.href = '../SuperAdminDashboard/SuperAdminDashboard.html';
                } else {
                    hideLoading('login');
                    showAlert('Unauthorized access', { type: 'error' });
                    await auth.signOut();
                }
            } catch (error) {
                hideLoading('login');
                showAlert('Login failed: ' + error.message, { type: 'error' });
            }
        });

        document.getElementById('collegeSignUpFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            const collegeName = document.getElementById('collegeName').value.trim();
            const email = document.getElementById('collegeSignUpEmail').value.trim();
            const password = document.getElementById('collegeSignUpPassword').value;
            const confirmPassword = document.getElementById('collegeSignUpConfirmPassword').value;
            
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', { type: 'warning' });
                return;
            }
            
            try {
                showLoading('signup');
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, 'Admin', userCredential.user.uid), {
                    collegeName: collegeName,
                    email: email,
                    status: 'pending',
                    createdAt: new Date()
                });
                await sendEmailVerification(userCredential.user);
                hideLoading('signup');
                showToast('Account created! Pending approval.');
                switchToLogin('college');
            } catch (error) {
                hideLoading('signup');
                showAlert('Sign up failed: ' + error.message, { type: 'error' });
            }
        });

        document.getElementById('systemSignUpFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('systemFullName').value.trim();
            const email = document.getElementById('systemSignUpEmail').value.trim();
            const password = document.getElementById('systemSignUpPassword').value;
            const confirmPassword = document.getElementById('systemSignUpConfirmPassword').value;
            
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', { type: 'warning' });
                return;
            }
            
            try {
                showLoading('signup');
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, 'Admin', userCredential.user.uid), {
                    collegeName: fullName,
                    email: email,
                    role: 'super_admin',
                    status: 'pending',
                    createdAt: new Date()
                });
                await sendEmailVerification(userCredential.user);
                hideLoading('signup');
                showToast('Account created! Pending approval.');
                switchToLogin('system');
            } catch (error) {
                hideLoading('signup');
                showAlert('Sign up failed: ' + error.message, { type: 'error' });
            }
        });
    </script>
</body>
</html>
