<body class="auth-page min-h-screen p-6 text-brand-900 antialiased">
    <div class="glass w-full max-w-md rounded-3xl p-8">
        <div class="mb-2 text-center">
            <div class="mx-auto h-12 w-12 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-bold text-xl shadow-lg mb-4">CV</div>
            <h2 class="text-3xl font-bold tracking-tight text-brand-950">Create College Admin Account</h2>
            <p class="mt-2 text-sm text-brand-500">Have an account? <a href="../logIn/LogInAdmin.html" class="text-brand-600 hover:text-brand-700 font-medium">College Admin Login</a></p>
            <p class="mt-1 text-xs text-brand-500">System Admin? <a href="../logIn/LogInSuperAdmin.html" class="text-brand-600 hover:text-brand-700 font-medium">Super Admin Login</a></p>
        </div>
        <form id="signupForm" class="mt-8 space-y-5">
            <div class="space-y-2">
                <label for="collegeName" class="block text-sm font-semibold text-brand-700">College Name</label>
                <input type="text" id="collegeName" name="collegeName" required
                    class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400"
                    placeholder="e.g., CITE(College of Information Technology Education)">
            </div>
            <div class="space-y-2">
                <label for="email" class="block text-sm font-semibold text-brand-700">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400">
            </div>
            <div class="space-y-2">
                <label for="password" class="block text-sm font-semibold text-brand-700">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400 pr-12">
                    <button type="button" onclick="togglePassword('password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-brand-500 hover:text-brand-700">
                        <svg id="eye-password" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eye-off-password" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l-3.293-3.293m0 0a3 3 0 104.243-4.243l3.293 3.293m-3.293-3.293l3.293 3.293M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="space-y-2">
                <label for="confirmPassword" class="block text-sm font-semibold text-brand-700">Confirm Password</label>
                <div class="relative">
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                        class="w-full px-4 py-3 rounded-xl input-glass text-brand-900 placeholder:text-brand-400 pr-12">
                    <button type="button" onclick="togglePassword('confirmPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-brand-500 hover:text-brand-700">
                        <svg id="eye-confirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eye-off-confirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l-3.293-3.293m0 0a3 3 0 104.243-4.243l3.293 3.293m-3.293-3.293l3.293 3.293M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit"
                class="w-full btn-primary font-semibold py-3 rounded-xl transition-all shadow-lg">
                Sign Up
            </button>
        </form>
    </div>
    <script>
        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const eyeOpen = btn.querySelector('[id^="eye-"]:not([id*="-off"])');
            const eyeOff = btn.querySelector('[id*="-off"]');
            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.classList.add('hidden');
                eyeOff.classList.remove('hidden');
            } else {
                input.type = 'password';
                eyeOpen.classList.remove('hidden');
                eyeOff.classList.add('hidden');
            }
        }
    </script>
