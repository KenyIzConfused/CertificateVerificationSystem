<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Students</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            950: '#052e16'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
  <script type="module" crossorigin src="/assets/registerStudents-DsSeNHSg.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/form-options-CbYxzy4S.js">
  <link rel="modulepreload" crossorigin href="/assets/ui-enhancements-CuU693vJ.js">
  <link rel="modulepreload" crossorigin href="/assets/PopupSystem-C6gwMGe4.js">
  <link rel="stylesheet" crossorigin href="/assets/ui-enhancements-B97ZuKGZ.css">
</head>
<body class="app-page min-h-screen p-0 text-brand-900 antialiased">
    <header class="w-full app-header">
        <div class="app-header__inner">
            <div class="brand-text">
                <span id="headerOrgName" class="brand-title">Register Students</span>
                <p class="brand-subtitle">Register students for faster event attendance tracking</p>
            </div>
            <div class="app-header__actions">
                <a href="../EventCRUD/EventCRUD.html" class="header-link">← Back to Event Manager</a>
            </div>
        </div>
    </header>
    <main class="page-content px-4 py-8">
        <div class="glass w-full max-w-4xl rounded-3xl p-8 mx-auto">
            <div id="registerWrapper" class="glass-strong rounded-2xl p-6 mb-8">
                <h2 class="text-2xl font-bold text-brand-900 mb-6">Add New Student</h2>
                <form id="registerForm" class="space-y-6">
                    <div class="space-y-2">
                        <label for="studentName" class="block text-sm font-semibold text-gray-700">Name</label>
                        <input type="text" id="studentName" name="studentName" required
                            class="w-full px-4 py-3 rounded-lg input-glass text-brand-900 placeholder:text-brand-400"
                            placeholder="e.g., Juan Dela Cruz">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">Course</label>
                        <select id="studentCourse" name="studentCourse" required 
                            class="w-full px-4 py-3 rounded-lg input-glass text-brand-900">
                            <option value="">Select Course</option>
                            <option value="BSCS">BSCS</option>
                            <option value="BSIS">BSIS</option>
                            <option value="BSIT">BSIT</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">Major & Year</label>
                        <div class="flex gap-2">
                            <div class="flex-1">
                                <label for="studentMajor" class="block text-xs text-gray-500 mb-1">Major</label>
                                <select id="studentMajor" name="studentMajor" required 
                                    class="w-full px-4 py-3 rounded-lg input-glass text-brand-900">
                                    <option value="">Select Major</option>
                                </select>
                            </div>
                            <div class="w-32">
                                <label for="studentYear" class="block text-xs text-gray-500 mb-1">Year</label>
                                <select id="studentYear" name="studentYear" required 
                                    class="w-full px-4 py-3 rounded-lg input-glass text-brand-900">
                                    <option value="">Select Year</option>
                                    <option value="1A">1A</option>
                                    <option value="1B">1B</option>
                                    <option value="1C">1C</option>
                                    <option value="1D">1D</option>
                                    <option value="2A">2A</option>
                                    <option value="2B">2B</option>
                                    <option value="2C">2C</option>
                                    <option value="2D">2D</option>
                                    <option value="3A">3A</option>
                                    <option value="3B">3B</option>
                                    <option value="3C">3C</option>
                                    <option value="3D">3D</option>
                                    <option value="4A">4A</option>
                                    <option value="4B">4B</option>
                                    <option value="4C">4C</option>
                                    <option value="4D">4D</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label for="studentIdNumber" class="block text-sm font-semibold text-gray-700">ID Number</label>
                        <input type="text" id="studentIdNumber" name="studentIdNumber" required
                            class="w-full px-4 py-3 rounded-lg input-glass text-brand-900"
                            placeholder="e.g., 2021-12345">
                    </div>
                    <button type="submit" class="w-full btn-primary font-semibold py-3 rounded-xl transition-all shadow-lg">
                        Register Student
                    </button>
                </form>
            </div>

            <div class="glass rounded-2xl p-6 mb-8">
                <h2 class="text-2xl font-bold text-brand-900 mb-4">Registered Students (<span id="registeredCount">0</span>)</h2>
                <input type="text" id="searchStudents" placeholder="Search students by name or ID..." 
                    class="w-full px-4 py-2 rounded-lg input-glass text-brand-900 placeholder:text-brand-400 mb-4 text-sm">
                <div class="overflow-x-auto max-h-96 overflow-y-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b-2 border-green-200 bg-white sticky top-0">
                                <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Name</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">ID Number</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Course</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Major</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Year</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="registeredTableBody">
                        </tbody>
                    </table>
                    <p id="noRegistered" class="text-brand-500 text-center py-8">No registered students yet.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
