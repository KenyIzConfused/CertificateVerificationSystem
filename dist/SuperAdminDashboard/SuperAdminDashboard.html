<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            950: '#052e16'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        }
        .btn-primary {
            background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-approved { background: #d1fae5; color: #065f46; }
        .admin-type-badge { font-size: 0.75rem; font-weight: 500; color: #6b7280; }
    </style>
  <script type="module" crossorigin src="/assets/superAdminDashboard-CQ1xcoy2.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/ui-enhancements-oSulpFv0.js">
  <link rel="modulepreload" crossorigin href="/assets/PopupSystem-C6gwMGe4.js">
  <link rel="stylesheet" crossorigin href="/assets/ui-enhancements-Dv2I7Okw.css">
</head>
<body class="super-admin-page app-page min-h-screen p-0 text-brand-900 antialiased">
    <!-- Full-width dashboard header -->
    <div class="max-w-4xl mx-auto">
        <header class="dashboard-page-header">
            <div class="dashboard-header-copy">
                <h1 class="text-3xl font-bold tracking-tight text-brand-950">Super Admin Dashboard</h1>
                <p class="text-brand-500 mt-1">Manage admin approvals (College Admin & System Admin)</p>
            </div>
            <button onclick="window.handleLogout()" class="dashboard-logout-button header-button">Logout</button>
        </header>

        <!-- Main dashboard workspace -->
        <main class="dashboard-layout">
            <!-- Smaller left panel for completed approval records -->
            <section class="dashboard-card dashboard-history-card" aria-labelledby="approvalHistoryTitle">
                <h2 id="approvalHistoryTitle" class="dashboard-card-title">Approval History</h2>
                <div id="historyContainer" class="dashboard-history-list">
                    <p class="dashboard-empty-state">No history yet.</p>
                </div>
            </section>

            <!-- Larger right panel for active approval requests -->
            <section class="dashboard-card dashboard-pending-card" aria-labelledby="pendingApprovalsTitle">
                <h2 id="pendingApprovalsTitle" class="dashboard-card-title">Pending Approvals</h2>
                <div id="pendingAdminsContainer" class="dashboard-pending-list">
                    <p class="dashboard-empty-state">No pending approvals.</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
