<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            950: '#052e16'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        }
        .btn-primary {
            background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-approved { background: #d1fae5; color: #065f46; }
        .admin-type-badge { font-size: 0.75rem; font-weight: 500; color: #6b7280; }
    </style>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="super-admin-page app-page min-h-screen p-0 text-brand-900 antialiased">
    <header class="w-full app-header">
        <div class="app-header__inner">
            <div class="brand-text">
                <span class="brand-title">Welcome to Event Manager</span>
            </div>
            <div class="app-header__actions">
                <button onclick="window.handleLogout()" class="header-button dashboard-logout-button">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main dashboard workspace -->
    <main class="dashboard-layout">
        <!-- Smaller left panel for completed approval records -->
        <section class="dashboard-card dashboard-history-card" aria-labelledby="approvalHistoryTitle">
            <div class="flex items-center justify-between mb-4">
                <h2 id="approvalHistoryTitle" class="dashboard-card-title">Approval History</h2>
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-1 text-xs text-gray-600 cursor-pointer">
                        <input type="checkbox" id="selectAllHistory" class="rounded border-gray-300">
                        Select All
                    </label>
                    <button onclick="window.deleteSelectedHistory()" id="deleteSelectedBtn" class="hidden px-3 py-1.5 bg-red-500 hover:bg-red-600 text-white text-xs font-semibold rounded-lg transition-all shadow-sm">
                        Delete Selected (<span id="selectedCount">0</span>)
                    </button>
                </div>
            </div>
            <div id="historyContainer" class="dashboard-history-list">
                <p class="dashboard-empty-state">No history yet.</p>
            </div>
        </section>

        <!-- Larger right panel for active approval requests -->
        <section class="dashboard-card dashboard-pending-card" aria-labelledby="pendingApprovalsTitle">
            <h2 id="pendingApprovalsTitle" class="dashboard-card-title">Pending Approvals</h2>
            <div id="pendingAdminsContainer" class="dashboard-pending-list">
                <p class="dashboard-empty-state">No pending approvals.</p>
            </div>
        </section>
    </main>
    <script type="module" src="../ui-enhancements.js"></script>
    <script type="module">
        import '../PopupSystem.js';
        import './SuperAdminDashboard.js';
    </script>
</body>
</html>
