<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            950: '#052e16'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Helvetica Neue', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        }
        .btn-primary {
            background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-approved { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body class="min-h-screen p-6 text-brand-900 antialiased">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-brand-950">Super Admin Dashboard</h1>
                <p class="text-brand-500 mt-1">Manage college admin approvals</p>
            </div>
            <a href="../logIn/LogInSuperAdmin.html" class="px-4 py-2 rounded-xl bg-white border border-brand-200 text-sm font-medium text-brand-600 hover:bg-brand-50">Logout</a>
        </header>

        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-brand-900 mb-4">Pending Approvals</h2>
            <div id="pendingAdminsContainer" class="space-y-4">
                <p id="noPending" class="text-brand-400 text-center py-8">No pending approvals.</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-6 mt-8">
            <h2 class="text-xl font-bold text-brand-900 mb-4">Approval History</h2>
            <div id="historyContainer" class="space-y-4">
                <p class="text-brand-400 text-center py-8">No history yet.</p>
            </div>
        </div>
    </div>
    <script type="module">
        import '../PopupSystem.js';
        import './SuperAdminDashboard.js';
    </script>
</body>
</html>
